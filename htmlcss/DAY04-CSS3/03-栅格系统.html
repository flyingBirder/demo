<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 引入bootstrap-icons样式表 -->

    <link rel="stylesheet" href="./bootstrap/fonts/bootstrap-icons.css">
    <!-- 引入bootstrap样式表 -->

    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
    <style>
        .bg-body-tertiary{
            background-color: pink !important;
        }
        .bi-list{
            font-size: 20px;
            color:red;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <span class="bi bi-list"></span>
        <span class="bi bi-sun"></span>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Navbar</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Features</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Pricing</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link disabled">Disabled</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
          <!-- 轮播图 -->
          <div id="carouselExampleIndicators" class="carousel slide">
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="./img/banner1.jpg" class="d-block w-100" alt="...">
              </div>
              <div class="carousel-item">
                <img src="./img/banner2.jpeg" class="d-block w-100" alt="...">
              </div>
              <div class="carousel-item">
                <img src="./img/banner1.jpg" class="d-block w-100" alt="...">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        <div class="row">
            <!-- xl: 大于等于1200px ; md: 大于等于992px ; sm: 大于等于768px ;
                xl-3 : 每个div占12列的3分 ; md-6 : 占12列的6分 ; sm-12 : 占12列的12分之一
            -->
            <div class="col-xl-3 col-md-6 col-sm-12">1</div>
            <div class="col-xl-3 col-md-6 col-sm-12">2</div>
            <div class="col-xl-3 col-md-6 col-sm-12">3</div>
            <div class="col-xl-3 col-md-6 col-sm-12">4</div>
        </div>
        <!--ement写法： div{$}*4 -->
        <div class="btn btn-primary">普通按钮</div>
        <div class="btn btn-success">成功按钮</div>
        <button class="btn btn-danger">危险按钮</button>
        <table class="table table-striped table-hover">
            <thead>
                <tr class="table-primary">
                    <th>姓名</th>
                    <th>年龄</th>
                    <th>性别</th>
                    <th>手机号</th>
                </tr>

            </thead>
            <tbody>
                <tr >
                    <td>1</td>
                    <td class="table-success">2</td>
                    <td>3</td>
                    <td>4</td>
                </tr>
                <tr class="table-danger">
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                </tr>

            </tbody>
           
           

        </table>

        

    </div>

    <!-- 引入bootstrap脚本表 -->
    <script src="./bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
