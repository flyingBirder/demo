<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table,
    td,
    th {
      border: 1px solid #ccc;
      border-collapse: collapse;

    }

    caption {
      font-size: 18px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    tr {
      height: 40px;
      text-align: center;
    }

    td {
      padding: 0 10px;
    }

    table tr:first-child {
      background-color: #ddd;
    }

    table tr:not(:first-child):hover {
      background-color: #eee;
    }
  </style>
</head>

<body>
  <table>
    <caption>学生列表</caption>
    <tr>
      <th>姓名</th>
      <th>年龄</th>
      <th>性别</th>
      <th>爱好</th>
      <th>地址</th>
      <th>邮箱</th>
    </tr>
    <script>
      let students = [
        {
          uname: 'bob',
          age: '28',
          gender: 'male',
          hobby: ['sing', 'dance'],
          address: '中国 北京',
          email: 'ob@qq.com',
        },
        {
          uname: 'lily',
          age: '18',
          gender: 'female',
          hobby: ['sing', 'dance'],
          address: '中国 香港',
          email: 'lily@qq.com',
        },
        {
          uname: 'alice',
          age: '19',
          gender: 'female',
          hobby: ['sing', 'dance'],
          address: '中国 上海',
          email: 'alice@qq.com',
        }
      ];
      for (let i = 0; i < students.length; i++) {
        document.write(`
          <tr>
            <td>${students[i].uname}</td>
            <td>${students[i].age}</td>
            <td>${students[i].gender}</td>
            <td>${students[i].hobby.join('、')}</td>
            <td>${students[i].address}</td>
            <td>${students[i].email}</td>
          </tr>
      
      `);


      }
    </script>
  </table>
</body>

</html>
