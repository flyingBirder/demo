<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table,
    th,
    td {
      border: 1px solid #ccc;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 20px;
    }

    th {
      background-color: #f2f2f2;
    }

    td {
      text-align: center;
    }

    tr:not(:first-child):hover {
      background-color: #e9e9e9;
    }
  </style>
</head>

<body>
  <script>
    let data = [
      {
        subject: '语文',
        score: '95'

      },
      {
        subject: '数学',
        score: '95'
      },
      {
        subject: '英语',
        score: '95'
      }
    ];
    let str = '';
    let totalScore = 0;
    for (let i = 0; i < data.length; i++) {
      str += `<tr>
          <td>${i + 1}</td>
          <td>${data[i].subject}</td>
          <td>${data[i].score}</td>
          <td><a href="javascript:;">删除</a></td>
        </tr>`;
      totalScore += Number(data[i].score);
    }

    document.write(`
    <table>
      <tr>
        <th>序号</th>
        <th>科目</th>
        <th>成绩</th>
        <th>操作</th>
      </tr>
      ${str}
      <tr>
        <td colspan="4">暂无数据</td>
      </tr>

      <tfoot>
        <tr>
          <td colspan="2">总成绩:${totalScore}</td>
          <td colspan="2">平均成绩:${totalScore / data.length}</td>
        </tr>
      </tfoot>
      
      
    </table>
    
    `);
  </script>
</body>

</html>
