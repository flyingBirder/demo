    function getValue(arr = []) {
      let max = arr[0];
      let min = arr[0];
      for (let i = 1; i < arr.length; i++) {
        arr[i] > max ? max = arr[i] : max;
        arr[i] < min ? min = arr[i] : min;
      }
      return [max, min];
    }
