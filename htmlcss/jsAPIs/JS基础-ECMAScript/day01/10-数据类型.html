<!DOCTYPE html>

<body>
  <script>
    // 计算圆的面积
    const PI = 3.14; // 圆周率, 是一个常量, 不能改变
    let R = 10; // 半径, 是一个变量, 可以改变
    let S = PI * R * R; // 面积, 是一个变量, 可以改变
    console.log(S);
  </script>

</body>
