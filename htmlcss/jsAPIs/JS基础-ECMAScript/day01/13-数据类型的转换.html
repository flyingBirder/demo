<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let age = prompt('请输入您的年龄');
    console.log(age);
    console.log(typeof age); // string 是字符串类型
    // prompt 输入的内容, 无论输入的是数字还是字符串, 都被认为是字符串类型
    // 所以, 如果要进行数值计算, 必须先将字符串转换为数值类型
    age = Number(age);
    console.log(age);
    console.log(typeof age); // number 是数值类型
    // 数值类型可以进行数值计算
    let num = '123';
    parseInt(num);// 123
    console.log(parseInt(num));
    console.log(parseInt('123.456')); // 123
    console.log(parseFloat('123.456')); // 123.456
    // 计算两数之和
    let num1 = parseInt(prompt('请输入一个数值'));
    let num2 = parseInt(prompt('请输入另一个数值'));
    document.write(`您输入的两个数值的和为: ${num1 + num2}`);
    console.log(num1 + num2);

  </script>

</body>

</html>
