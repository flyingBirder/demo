<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>

    let name = '张三';
    let age = 18;
    document.write('大家好，我是' + name + ',今年' + age + '岁了。');
    // 模版字符串``, 可以在字符串中嵌入变量, 变量用${}包裹, 可以换行
    document.write(`大家好，我是${name},今年${age}岁了。`);

  </script>

</body>

</html>
