<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 其他三种数据类型
    // 1. 布尔值 boolean
    let isTrue = true; // 布尔值, 只有两个值, true ,false 是布尔型字面量
    console.log(isTrue);

    let age;
    //console.log(age); // undefined 表示变量未被赋值
    console.log(typeof age); // undefined 是 undefined 类型

    let obj = null; // null 表示变量赋值了，但内容为空
    //console.log(obj);
    console.log(typeof obj); // object 是对象类型

    // null 和 undefined 计算区别
    console.log(null + 1); // 1
    console.log(undefined + 1); // NaN



  </script>

</body>

</html>
