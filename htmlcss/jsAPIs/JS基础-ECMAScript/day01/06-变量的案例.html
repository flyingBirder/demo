<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>输入用户名的案例</title>
</head>

<body>
  <script>
    // 1.变量的声明与赋值
    let username = prompt('请输入您的用户名：');
    // 2.变量的使用：页面打印输出
    document.write('您输入的用户名是：' + username);
  </script>

</body>

</html>
