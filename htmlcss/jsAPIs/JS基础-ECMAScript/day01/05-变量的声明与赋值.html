<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.变量的声明
    let num = 10;
    let name = '张三';
    let sex = '男';
    let age = 18;
    // 2.变量的赋值
    num = 20;
    name = '李四';
    sex = '女';
    age = 20;
    // 3.变量的使用
    console.log(num);
    console.log(name);
    console.log(sex);
    console.log(age);
    // 声明多个变量，用逗号隔开
    let a = 10, b = 20, c = 30;
    console.log(a);
    console.log(b);
    console.log(c);


  </script>
</body>

</html>
