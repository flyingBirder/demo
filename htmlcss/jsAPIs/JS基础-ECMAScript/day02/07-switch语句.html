<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let num1 = parseInt(prompt('请输入一个数字'));
    let num2 = parseInt(prompt('请输入第二个数字'));
    let operator = prompt('请输入+ - * /  其中一个运算符');
    switch (operator) {
      case '+':
        alert(num1 + num2);
        break;
      case '-':
        alert(num1 - num2);
        break;
      case '*':
        alert(num1 * num2);
        break;
      case '/':
        alert(num1 / num2);
        break;
      default:
        alert('请输入正确的运算符');
        break;
    }
  </script>

</body>

</html>
