<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let score = prompt('请输入一个成绩');
    score = parseInt(score);
    if (score > 90) {
      alert('恭喜你，成绩优秀');
    } else if (score > 80) {
      alert('恭喜你，成绩良好');
    } else if (score > 70) {
      alert('恭喜你，成绩中等');
    } else if (score > 60) {
      alert('恭喜你，成绩及格');
    } else {
      alert('很遗憾，成绩不及格');
    }
  </script>

</body>

</html>
