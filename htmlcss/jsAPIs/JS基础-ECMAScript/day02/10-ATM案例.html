<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let money = 1000;
    let option = prompt('请选择你的操作：1.查询余额 2.存款 3.取款 4.退出');
    switch (option) {
      case '1':
        alert(`你的余额为${money}`);
        break;
      case '2':
        let deposit = prompt('请输入你要存款的金额');
        money += Number(deposit);
        alert(`你存款${deposit}元成功，当前余额为${money}`);
        break;
      case '3':
        let withdraw = parseInt(prompt('请输入您的取款金额'));
        if (withdraw > money) {
          alert('您的余额不足');
        } else {
          money -= withdraw;
          alert(`n您的取款金额未${withdraw}元，当前余额为${money}`);
        }
        break;
      case '4':
        alert('谢谢使用');
        break;

    }




  </script>
</body>

</html>
