    let arr = [12, 7, 1, 57, 34];
    let max = arr[0];
    let min = arr[0];
    for (let i = 0; i < arr.length; i++) {
      if (arr[i + 1] > max) {
        max = arr[i + 1];
      }
      if (arr[i + 1] < min) {
        min = arr[i + 1];
      }
    }
    document.write(`<p>数组${arr}的最大值为${max}，最小值为${min}</p>`);
