<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        div {
            margin: 100px auto;
            width: 300px;
            color: #333;
        }
    </style>
</head>

<body>
    <div></div>
    <script>
        function getMyDate() {
            const date = new Date();
            let h = date.getHours();
            let m = date.getMinutes();
            let s = date.getSeconds();
            h = h < 10 ? '0' + h : h;
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;
            return `当前时间：${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日${h}时${m}分${s}秒`;
        }
        const div = document.querySelector('div');
        div.innerHTML = getMyDate();// 初始化时间,防止加载时页面显示空白
        console.log(new Date());// 查看当前时间戳
        // 定时器：每秒钟更新一次时间
        /* setInterval(() => {
            div.innerHTML = getMyDate();
        }, 1000); */
        setInterval(function () {
            div.innerHTML = getMyDate();
        }, 1000);
    </script>
</body>

</html>
