<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面表单验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: #000;
        }

        body {
            background-color: #f5f5f5;
        }

        .box {
            padding: 20px;

            width: 300px;
            margin: 100px auto;
            background-color: #fff;
        }

        .tab-nav {
            display: flex;
            justify-content: space-between;
        }

        .tab-nav a {
            font-size: 18px;
            height: 35px;
            line-height: 35px;

        }

        .tab-nav a.active {
            border-bottom: 2px solid #17bb9b;
        }

        .tab-panel {}

        .tab-panel .link {
            text-align: right;
            margin-bottom: 20px;
        }

        .tab-panel .link a {
            font-size: 12px;
            color: #17bb9b;
        }

        .tab-panel .input {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }


        .tab-panel span {
            position: absolute;
            left: 1px;
            top: 1px;
            background-color: #ccc;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
        }

        .tab-panel input {

            width: 100%;
            height: 32px;
            line-height: 32px;
            padding-left: 38px;
            border: 1px solid #17bb9b;

        }

        /* 输入框获取焦点时的样式 */
        .tab-panel input:focus {
            outline: none;
        }

        .tab-panel input::placeholder {
            font-size: 12px;
        }

        .tab-panel .agree {
            margin-bottom: 20px;
            font-size: 12px;
            color: #333;

        }

        .tab-panel .agree a {
            color: #17bb9b;
        }

        .tab-panel .agree input.remember {
            width: 12px;
            height: 12px;
            vertical-align: bottom;
        }

        .button {
            margin-bottom: 20px;
        }

        .button button {
            width: 100%;
            height: 32px;
            line-height: 32px;
            background-color: #17bb9b;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .footer {
            display: flex;
            justify-content: space-between;
        }

        .footer a {
            font-size: 12px;
            color: #333;
        }
    </style>
</head>

<body>
    <form action="" autocomplete="off">
        <div class="box">
            <div class="tab-nav">
                <a data-id="0" href="javascript:void(0);" class="active">账户登录</a>
                <a data-id="1" href="javascript:void(0);">二维码登录</a>
            </div>
            <div class="tab-panel">
                <div class="link">
                    <a href="javascript:void(0);">手机验证码登录</a>
                </div>
                <div class="input">
                    <span class="iconfont "></span>
                    <input type="text" placeholder="请输入用户名称/手机号码" name="username" required>
                </div>
                <div class="input">
                    <span class="iconfont "></span>
                    <input type="text" placeholder="请输入密码" name="password" required>
                </div>
                <div class="agree">
                    <label for="my-checkbox">
                        <input type="checkbox" value="1" id="my-checkbox" class="remember" name="agree">
                        <i class="iconfont "></i>
                    </label>
                    我已同意《<a href="javascript:void(0);">服务条款</a>》和《<a href="javascript:void(0);">隐私政策</a>》
                </div>
                <div class="button clearfix">
                    <button type="submit" class="login-btn">登录</button>
                </div>
                <div class="footer">
                    <a href="javascript:void(0);">忘记密码？</a>
                    <a href="javascript:void(0);">免费注册</a>
                </div>
            </div>
            <div class="tab-panel" style="display: none;">222</div>
        </div>
    </form>
    <script>
        // 1.获取元素
        const tab_nav = document.querySelector('.tab-nav');
        const tab_panel = document.querySelectorAll('.tab-panel');
        // 2.绑定事件 事件委托
        tab_nav.addEventListener('click', function (e) {
            // 2.1取消默认事件
            e.preventDefault();
            // 2.2判断是否点击的是a标签
            if (e.target.tagName === 'A') {
                // 取消所有元素的类名
                tab_nav.querySelector('.active').classList.remove('active');
                // 当前元素添加类名
                e.target.classList.add('active');
            }
            // 2.3切换tab-panel
            for (let i = 0; i < tab_panel.length; i++) {
                tab_panel[i].style.display = 'none';
            }
            tab_panel[e.target.dataset.id].style.display = 'block';
        });

        // 3.点击提交按钮
        const form = document.querySelector('form');
        const agree = document.querySelector('[name="agree"]');
        const username = document.querySelector('[name="username"]');
        const password = document.querySelector('[name="password"]');
        form.addEventListener('submit', function (e) {
            // 3.1取消默认事件
            e.preventDefault();
            // 3.2判断是否勾选同意服务条款和隐私政策
            if (!agree.checked) {
                alert('请先同意服务条款和隐私政策');
                return false;
            }
            // 记录用户名到本地存储
            localStorage.setItem('userName', username.value);
            // 假设登录成功，跳转到首页
            location.href = './07-index.html';
        });
    </script>
</body>

</html>
