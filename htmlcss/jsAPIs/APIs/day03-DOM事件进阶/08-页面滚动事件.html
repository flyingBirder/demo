<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
        }


        .slider {
            position: fixed;
            top: 300px;
            right: 10px;
            width: 80px;
            height: 150px;
            background-color: #eee;
            text-align: center;
            line-height: 100px;
            color: #333;
            cursor: pointer;
            opacity: 0;
            transition: all .3s ease-in-out;
        }

        .slider span {
            font-size: 12px;

        }

        .nav {

            width: 100%;
            height: 150px;
            background-color: #333;
            color: #fff;
            line-height: 50px;
            text-align: center;
            background-color: aquamarine;
        }

        .banner {
            height: 300px;
            width: 100%;
            background: pink;
        }

        .container {
            width: 100%;
            height: 800px;
            background-color: #fff;
        }
    </style>
</head>

<body>
    <div class="nav"></div>
    <div class="banner"></div>
    <div class="container"></div>
    <div class="slider">
        <span>返回顶部</span>
    </div>
    <script>
        const slider = document.querySelector('.slider');
        const backtop = document.querySelector('.slider span');
        const banner = document.querySelector('.banner');

        // 页面滚动事件window对象/文档对象
        window.addEventListener('scroll', function () {
            console.log(document.documentElement.scrollTop);// 向上滚动的距离 ,可读写
            /* if (document.documentElement.scrollTop > 400) {
                slider.style.opacity = 1;
            } else {
                slider.style.opacity = 0;
            } */
            //console.log(banner.offsetTop);// 元素距离有定位的父元素即文档顶部的距离
            slider.style.opacity = document.documentElement.scrollTop >= banner.offsetTop ? 1 : 0;
        });
        // 点击返回页面顶部事件
        backtop.addEventListener('click', function () {
            // 方法一：页面滚动到顶部 scrollTop该属性具有可读写权限
            // document.documentElement.scrollTop = 0;
            //方法二： scrollTo()方法 页面滚动到顶部
            window.scrollTo(0, 0);
        })



    </script>
</body>

</html>
