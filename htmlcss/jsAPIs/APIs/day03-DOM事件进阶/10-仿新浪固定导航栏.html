<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 3000px;
        }

        .nav {
            position: fixed;
            top: -80px;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #ff7;
            line-height: 80px;
            text-align: center;
            font-size: 30px;
            transition: all .3s ease-in-out;
        }

        .content {
            width: 100%;
            height: 300px;
            background-color: aqua;
            color: #fff;

        }

        .maiosha {

            width: 300px;
            height: 300px;
            line-height: 300px;
            text-align: center;
            font-size: 28px;
            color: #fff;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="nav">固定导航栏</div>
    <div class="content">
    </div>
    <div class="maiosha">秒杀</div>
    <script>
        const nav = document.querySelector('.nav');
        const content = document.querySelector('.content');
        const maiosha = document.querySelector('.maiosha');
        window.addEventListener('scroll', function () {
            const miaoshaoffsetTop = maiosha.offsetTop;
            const scrollTop = document.documentElement.scrollTop;
            nav.style.top = scrollTop >= miaoshaoffsetTop ? '0px' : '-80px';
        })
    </script>

</body>

</html>
