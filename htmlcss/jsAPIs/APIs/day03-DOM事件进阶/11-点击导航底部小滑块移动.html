<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .tab-list {

            width: 300px;
            height: 50px;
            line-height: 50px;
            background-color: #f5f5f5;
        }

        .tab-list ul {
            position: relative;

            margin: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-list ul li {
            list-style: none;
        }

        .tab-list ul li a {
            text-decoration: none;
            color: #000;
        }

        .tab-list ul li a:hover {
            color: #f00;
        }

        .tab-list ul li a.active {
            color: #f00;
        }

        .tab-list ul li a.active {
            color: #f00;
        }

        .tab-list .slideLine {
            width: 32px;
            height: 5px;
            background-color: #f00;
            position: absolute;
            top: 45px;
            left: 0px;
            /* 小滑块移动 过渡 效果 */
            transition: all .3s;
        }
    </style>
</head>

<body>
    <div class="tab-list">
        <ul>
            <li><a href="#">首页</a></li>
            <li><a href="#">动画</a></li>
            <li><a href="#">游戏</a></li>
            <li><a href="#">视频</a></li>
            <li><a href="#">直播</a></li>
            <div class="slideLine"></div>
        </ul>
    </div>
    <script>
        const ul = document.querySelector('.tab-list ul');
        const slideLine = document.querySelector('.tab-list .slideLine');
        // 事件委托 点击导航底部小滑块移动
        ul.addEventListener('click', function (e) {
            // 事件对象 点击的元素
            if (e.target.tagName === 'A') {
                // console.log(e.target.offsetLeft);
                slideLine.style.transform = `translateX(${e.target.offsetLeft}px)`;
            }


        });
    </script>
</body>

</html>
