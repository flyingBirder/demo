<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .tab {
            width: 500px;
            height: 448px;
            margin: 0 auto;
            overflow: hidden;
        }

        .tab-nav {
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tab-nav h3 {
            flex: 1;
        }

        .tab-nav ul {
            width: 500px;
            height: 48px;
            list-style: none;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .tab-nav ul li {
            width: 20%;
            height: 48px;
            line-height: 48px;
            text-align: center;

        }

        .tab-nav a {
            width: 100%;
            height: 100%;
            display: block;
            text-decoration: none;
            color: #999;
            font-size: 16px;
        }

        .tab-nav a.active {
            margin-top: 1px;
            color: red;
            background-color: #fff;
            border: 1px solid pink;
            border-bottom: 0;
        }

        .tab-content {
            height: 400px;
            border: 1px solid pink;
        }

        .tab-content .item {
            height: 100%;
            padding: 20px 30px;
            font-size: 24px;
            display: none;
        }

        .tab-content .item.active {
            display: block;
            background-color: #fff;

        }
    </style>
</head>

<body>
    <div class="tab">
        <div class="tab-nav">
            <ul>
                <li><a href="javascript:void(0)" class="active" data-id="1">1</a></li>
                <li><a href="javascript:void(0)" data-id="2">2</a></li>
                <li><a href="javascript:void(0)" data-id="3">3</a></li>
                <li><a href="javascript:void(0)" data-id="4">4</a></li>
            </ul>
        </div>
        <div class="tab-content">
            <div class="item active">1111</div>
            <div class="item">2222</div>
            <div class="item">3333</div>
            <div class="item">4444</div>
        </div>
    </div>
    <script>
        const ul = document.querySelector('.tab-nav ul');
        // 点击li切换tab 事件委托给ul 
        ul.addEventListener('click', function (e) {
            if (e.target.tagName === 'A') {
                document.querySelector('.tab-nav .active').classList.remove('active');
                e.target.classList.add('active');
            }
            let i = +e.target.dataset.id;
            console.log(i);
            // tabcontent 
            document.querySelector('.tab-content .active').classList.remove('active');
            // document.querySelector(`.tab-content .item:nth-child(${i})`).classList.add('active');
            document.querySelectorAll('.tab-content .item')[i - 1].classList.add('active');

        });
    </script>
</body>

</html>
