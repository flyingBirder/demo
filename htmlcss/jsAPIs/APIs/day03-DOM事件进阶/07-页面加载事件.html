<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // load:等待页面所有资源加载完成，再执行回调函数
        window.addEventListener('load', function () {
            console.log('页面所有资源加载完成');
        })
    </script>
</head>

<body>

    <div><img src="./images/1.jpeg" alt=""></div>

    <script>
        const img = document.querySelector('img');// 获取图片元素
        // 等待图片加载完成，再执行回调函数
        img.addEventListener('load', function () {
            console.log('图片加载完成');
        })
        // DOMContentLoaded：等待DOM加载完成，再执行回调函数
        window.addEventListener('DOMContentLoaded', function () {
            console.log('DOM加载完成');
        })
    </script>
</body>

</html>
