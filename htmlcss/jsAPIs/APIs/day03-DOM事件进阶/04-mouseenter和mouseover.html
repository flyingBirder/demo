<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .father {
            width: 500px;
            height: 500px;
            background-color: red;
        }

        .son {
            width: 300px;
            height: 300px;
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="father">
        <div class="son"></div>
    </div>
    <script>
        const father = document.querySelector('.father');
        const son = document.querySelector('.son');
        // mouseenter 鼠标进入元素时触发 不冒泡, 只触发一次
        // mouseleave 鼠标离开元素时触发 不冒泡, 只触发一次
        // mouseover 鼠标进入子元素时会冒泡触发父元素，不推荐使用
        // mouseout 鼠标离开子元素时会冒泡触发父元素，不推荐使用
        father.addEventListener('mouseover', function () {
            console.log('鼠标进入了父元素');
        });
        father.addEventListener('mouseout', function () {
            console.log('鼠标离开了父元素');
        });


    </script>
</body>

</html>
