<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ul,
    li {
      list-style: none;
    }

    .slider {
      margin: 0 auto;
      width: 800px;
      height: 500px;
      overflow: hidden;
    }

    .slder-wrapper {
      width: 100%;
      height: 90%;
    }

    .slder-wrapper img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slider-footer {
      margin: 0 auto;
      width: 800px;
      height: 10%;
      background-color: red;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-footer p {
      margin-left: 20px;
      font-size: 18px;
      color: #fff;

    }

    .slider-indicator {
      display: flex;
      align-items: center;
    }

    .slider-indicator li {
      width: 8px;
      height: 8px;
      margin: 5px;
      border-radius: 50%;
      background-color: #fff;
      opacity: .4;
      cursor: pointer;
    }

    .slider-indicator li.active {
      opacity: 1;
      width: 12px;
      height: 12px;
    }

    .slider-footer .toggle {
      margin-right: 20px;

    }

    .slider-footer.toggle button {
      margin-right: 20px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="slider">
    <div class="slder-wrapper">
      <img src="../day01-获取元素/images/1.jpeg" alt="">
    </div>
    <div class="slider-footer">
      <p>第一张图片</p>
      <ul class="slider-indicator">
        <li class="active"></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
      <div class="toggle">
        <button class="prev">&lt;</button>
        <button class="next">&gt;</button>
      </div>
    </div>
  </div>

  <script>
    const data = [
      {
        url: '../day01-获取元素/images/1.jpeg',
        title: '第一张图片',
        color: 'red'
      },
      {
        url: '../day01-获取元素/images/2.jpeg',
        title: '第二张图片',
        color: 'orange'
      },
      {
        url: '../day01-获取元素/images/3.jpeg',
        title: '第三张图片',
        color: 'yellow'
      },
      {
        url: '../day01-获取元素/images/4.jpeg',
        title: '第四张图片',
        color: 'green'
      },
      {
        url: '../day01-获取元素/images/5.jpeg',
        title: '第五张图片',
        color: 'aqua'
      },
      {
        url: '../day01-获取元素/images/6.jpeg',
        title: '第六张图片',
        color: 'blue'
      }, {
        url: '../day01-获取元素/images/7.jpeg',
        title: '第七张图片',
        color: 'purple'
      }
    ];
    const slider = document.querySelector('.slider');
    const img = document.querySelector('.slder-wrapper img');
    const next = document.querySelector('.next');
    const prev = document.querySelector('.prev');
    const p = document.querySelector('.slider-footer p');
    const color = document.querySelector('.slider-footer');
    let i = 0;
    next.addEventListener('click', function () {
      i++;
      if (i >= data.length) {
        i = 0;
      }
      circleRender()
    });
    prev.addEventListener('click', function () {
      i--;
      if (i < 0) {
        i = data.length - 1;
      }
      circleRender();
    });

    function circleRender() {
      img.src = data[i].url;
      p.innerHTML = data[i].title;
      color.style.backgroundColor = data[i].color;
      document.querySelector('.slider-indicator li.active').classList.remove('active');
      document.querySelector(`.slider-indicator li:nth-child(${i + 1})`).classList.add('active');
    }
    // 自动轮播图片
    let timer = setInterval(function () {
      next.click();// 利用JS自动调用
    }, 1000);
    slider.addEventListener('mouseenter', function () {
      clearInterval(timer);
    });
    slider.addEventListener('mouseleave', function () {
      // 鼠标离开轮播图时，重新开启自动轮播,开启之前先关闭定时器
      clearInterval(timer);
      timer = setInterval(function () {
        next.click();// 利用JS自动调用
      }, 1000);
    });



  </script>
</body>

</html>
