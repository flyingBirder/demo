<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论回车发布</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .wrapper {
            margin: 20px auto;
            min-width: 400px;
            max-width: 800px;
            display: flex;
            justify-content: flex-end;
        }

        .avatar {
            display: block;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            /* background-image: url(./avatar.jpg) no-repeat center / cover; */
            background-color: #ccc;


        }

        .wrapper textarea {
            outline: none;
            border-color: transparent;
            resize: none;
            background-color: #f5f5f5;
            border-radius: 4px;
            flex: 1;
            margin-left: 20px;
            height: 30px;
            line-height: 30px;
            padding: 0px 10px;

        }

        /* 文本域获得焦点时的样式 */
        .wrapper textarea:focus {
            border-color: #e4e4e4;
            background: #fff;
            height: 50px;
            transition: all .3s;
        }

        .wrapper button {
            margin-left: 10px;
            border: 0;
            color: #fff;
            border-radius: 5px;
            background-color: #00aeec;
            width: 70px;
            cursor: pointer;
        }

        .wrapper .total {
            margin-right: 80px;
            margin-top: 5px;
            color: #999;
            opacity: 0;
            transition: all .3s;
        }

        .list {
            min-width: 400px;
            max-width: 800px;
            display: flex;
            margin: 0 auto;
        }

        .list .item {
            width: 100%;
            display: flex;
        }

        .list .item .info {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e4e4e4;
            margin-left: 20px;
        }

        .list .item .info p {
            margin-right: 10px;
        }

        .list .item .name {
            color: #fb7299;
            font-size: 14px;
            font-weight: bold;
        }

        .list .item .text {
            color: #333;
            padding: 10px 0;
            flex: 1;

        }

        .list .item .time {
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <i class="avatar"></i>
        <textarea name="" id="tx" cols="30" rows="10" placeholder="请输入友善的评论"></textarea>
        <button>发表评论</button>
    </div>
    <div class="wrapper">
        <span class="total">0/200字</span>
    </div>
    <div class="list">
        <div class="item" style="display: none;">
            <i class="avatar"></i>
            <div class="info">
                <p class="name">张三 </p>
                <p class="text">这是一条评论</p>
                <p class="time">2023-08-01 12:00:00</p>
            </div>
        </div>
    </div>
    <script>
        const tx = document.querySelector('#tx');
        const total = document.querySelector('.total');
        const item = document.querySelector('.item');
        const name = document.querySelector('.name');
        const text = document.querySelector('.text');
        const time = document.querySelector('.time');
        // 文本域获得焦点
        tx.addEventListener('focus', function () {
            total.style.opacity = 1;
        });
        // 文本域失去焦点
        tx.addEventListener('blur', function () {
            total.style.opacity = 0;
        });
        // 文本域输入内容
        tx.addEventListener('input', function () {
            total.innerHTML = `${tx.value.length}/200字`;
        });

        // 按下回车发布评论
        tx.addEventListener('keyup', function (e) {
            if (e.key === 'Enter') {
                if (tx.value.trim() !== '') {
                    console.log(tx.value.trim());
                    item.style.display = 'flex';
                    // name.innerHTML = '张三';
                    text.innerHTML = tx.value.trim();// 去掉首尾空格
                    // time.innerHTML = new Date().toLocaleString();

                }
                tx.value = '';// 清空文本域内容



            }
        });

    </script>
</body>

</html>
