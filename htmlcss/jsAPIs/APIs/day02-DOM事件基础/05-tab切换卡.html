<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .tab {
            margin: 0 auto;
            width: 500px;
            height: 500px;
        }

        .tab-nav {
            width: 100%;
            height: 50px;
            line-height: 50px;
            text-align: center;
            background-color: #f5f5f5;
        }

        .tab-nav ul {
            height: 100%;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }

        .tab-nav ul li {
            cursor: pointer;
            width: 25%;
            height: 100%;
        }

        .tab-nav ul li.active {
            background-color: pink;
            color: red;
        }

        .tab-content {
            width: 100%;
            height: 450px;
            background-color: #fff;
        }

        .tab-content .item {
            display: none;
            height: 450px;
            display: none;
            padding: 20px 15px;
            background-color: pink;
        }

        .tab-content .item.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="tab">
        <div class="tab-nav">
            <ul>
                <li class="active">1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
            </ul>

        </div>
        <div class="tab-content">
            <div class="item active">1111</div>
            <div class="item">2222</div>
            <div class="item">3333</div>
            <div class="item">4444</div>

        </div>
    </div>
    <script>
        const tabli = document.querySelectorAll('.tab-nav ul li');
        const tabItem = document.querySelectorAll('.tab-content .item');
        for (let i = 0; i < tabli.length; i++) {
            tabli[i].addEventListener('mouseenter', function () {
                document.querySelector('.tab-nav ul li.active').classList.remove('active');
                document.querySelector('.tab-content .item.active').classList.remove('active');
                tabli[i].classList.add('active');
                // tabItem[i].classList.add('active');
                document.querySelector(`.tab-content .item:nth-child(${i + 1})`).classList.add('active');

            });
        }
    </script>
</body>

</html>
