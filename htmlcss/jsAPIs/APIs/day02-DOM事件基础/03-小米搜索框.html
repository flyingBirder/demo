<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ul,
        li {
            list-style: none;
        }

        a {
            text-decoration: none;
        }

        .search-box {
            position: relative;
            width: 260px;
            margin: 20px auto;
        }

        .search-box input {
            width: 100%;
            height: 48px;
            line-height: 48px;
            padding: 0 10px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            outline: none;

        }

        /* .search-box input:focus {
            border-color: #ff6700;
        } */
        .search-box .search {
            border-color: #ff6700;

        }

        .search-list {
            display: none;
            position: absolute;
            top: 48px;
            left: 0;
            width: 100%;
            border-top: 0;
            border: 1px solid #ff6700;
            background-color: #fff;
            border-top: 0;
        }

        .search-list li {
            padding: 10px;
            /* border: 1px solid #ccc; */

        }

        .search-list li a {
            display: block;
            padding: 6px 15px;
            font-size: 12px;
            color: #424242;
            text-decoration: none;
        }

        .search-list li:hover {
            background-color: #eee;
        }
    </style>
</head>

<body>
    <div class="search-box">
        <input type="search" placeholder="小米笔记本">
        <ul class="search-list">
            <li><a href="#">小米笔记本</a></li>
            <li><a href="#">小米手机</a></li>
            <li><a href="#">小米智能音箱</a></li>
            <li><a href="#">小米智能电视</a></li>
            <li><a href="#">小米智能家电</a></li>
        </ul>
    </div>
    <script>
        const input = document.querySelector('input[type="search"]');// 属性选择器[type="search"]
        const searchList = document.querySelector('.search-list');
        // 搜索框获得焦点时，显示搜索列表
        input.addEventListener('focus', function () {
            searchList.style.display = 'block';
            input.classList.add('search');
        });
        // 搜索框失去焦点时，隐藏搜索列表
        input.addEventListener('blur', function () {
            searchList.style.display = 'none';
            input.classList.remove('search');
        });

    </script>
</body>

</html>
