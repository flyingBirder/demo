<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #slideBox {
      position: relative;
      width: 500px;
      height: 500px;
      overflow: hidden;
    }

    img {
      width: 100%;
      height: 80%;
    }

    #colorBox {
      width: 100%;
      height: 100px;
    }

    ul {
      list-style: none;
      position: absolute;
      bottom: 15px;
      left: 5px;
    }

    .box {
      width: 5px;
      height: 5px;
      background-color: #ccc;
      display: inline-block;
    }

    .active {
      background-color: #fff;
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <div id="slideBox">
    <img src="./images/1.jpeg" alt="">
    <div id="colorBox"></div>
    <ul>
      <li class="box"></li>
      <li class="box"></li>
      <li class="box"></li>
      <li class="box"></li>
      <li class="box"></li>
    </ul>
  </div>
  <script>
    const slideData = [
      {
        url: './images/1.jpeg',
        title: '这是第1张图片',
        color: 'rgb(200,7,6)',
      },
      {
        url: './images/2.jpeg',
        title: '这是第2张图片',
        color: 'rgb(100,6,6)',
      },
      {
        url: './images/3.jpeg',
        title: '这是第3张图片',
        color: 'rgb(100,67,255)',
      },
      {
        url: './images/4.jpeg',
        title: '这是第4张图片',
        color: 'rgb(100,255,6)',
      },
      {
        url: './images/5.jpeg',
        title: '这是第5张图片',
        color: 'rgb(255,67,6)',
      },

    ];
    const random = Math.floor(Math.random() * slideData.length);
    const slideBox = document.querySelector('#slideBox');
    slideBox.querySelector('img').src = slideData[random].url;
    slideBox.querySelector('img').title = slideData[random].title;
    slideBox.querySelector('#colorBox').style.backgroundColor = slideData[random].color;
    console.log(random);

    // slideBox.querySelector('ul').querySelectorAll('li')[random].classList.add('active');// 给随机的li添加active类名
    slideBox.querySelector('ul').querySelector(`li:nth-child(${random + 1})`).classList.add('active');// 给随机的li添加active类名








  </script>
</body>

</html>
