<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const arr = [{
            name: 'lily',
            salary: 10000
        }, {
            name: 'sam',
            salary: 15000
        }, {
            name: 'bob',
            salary: 20000
        }];
        // 薪资求和 reduce方法 第二个参数必须有初始值0 否则prev默认是数组的第一个元素即对象 
        const sum = arr.reduce((prev, current) => { return prev + current.salary }, 0);
        console.log(sum);// 45000
        //  需求：每人工资增加30%，求增加后的薪资总和
        const arr2 = arr.reduce((prev, current) => {
            return prev + current.salary * 1.3;
        }, 0);
        console.log(arr2);// 58500

    </script>

</body>

</html>
