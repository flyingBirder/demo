<body>

    <script>
        // 构造函数
        // 1.公共属性写在构造函数中
        function Person(name, age, sex) {
            this.name = name;
            this.age = age;
            this.sex = sex;
            // 写在构造函数中浪费内存空间
            /* this.say = function () {
                console.log(`我是${this.name}，我今年${this.age}岁，我是${this.sex}`);
            } */
        }
        // 原型对象 Person.prototype
        // Person.prototype
        //console.dir(Person.prototype); // object 

        // 原型对象上的方法可以被所有实例化对象调用  
        // 用原型对象.属性的方式 赋值操作

        // 2.公共方法写在原型对象中
        Person.prototype.sayHello = function () {
            console.log('hello');
        }

        // 实例化对象
        const p1 = new Person('张三', 18, '男');
        const p2 = new Person('李四', 20, '女');
        // 调用原型对象上的方法
        p1.sayHello(); // hello
        p2.sayHello(); // hello
