<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            text-align: center;
        }

        button {
            margin: 20px;
            padding: 10px 20px;
            font-size: 20px;
            border: 0;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            color: red;
            background-color: #fff;
            cursor: pointer;
            z-index: 1;
        }

        .modal {
            z-index: 99;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 400px;
            background-color: rgba(0, 0, 0, 0);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            /* display: flex;
            justify-content: center;
            align-items: center; */
            padding: 20px;
        }

        .modal-header {

            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        .modal-content {

            text-align: center;
            height: 310px;
            line-height: 310px;
            width: 100%;

        }
    </style>
</head>

<body>
    <button id="delBtn">删除</button>
    <button id="loginBtn">登录</button>



    <script>
        // 1. 封装Modal框
        function Modal(title = '', message = '') {
            // 创建Modal框
            // 1.1创建div标签
            this.modalBox = document.createElement('div');
            // 1.2为Modal框添加类名
            this.modalBox.className = 'modal';
            // 1.3为Modal框添加HTML内容
            this.modalBox.innerHTML = `
                <div class="modal-header">
                    <h2>${title}</h2>
                    <i>X</i>
                </div>
                <div class="modal-content">
                    <p>${message}</p>
                </div>
            `;

            // console.log(this.modalBox);

        }


        // 2.给 构造函数原型Modal.prototype 挂载open方法
        Modal.prototype.open = function () {
            // 2.0判断是否有Modal框存在，有则删除
            const box = document.querySelector('.modal');
            box && box.remove();
            // 注意这个方法不要使用箭头函数写法，否则this指向会出问题
            // 2.1将刚刚创建的Modal框添加到页面body中
            document.body.append(this.modalBox);

            // 需要等Modal框显示在页面，才能绑定关闭事件
            this.modalBox.querySelector('i').addEventListener('click', () => this.close()); // 点击关闭按钮时调用close方法// 这里需要用到箭头函数，this指向Modal实例对象
        }
        // 3. 给构造函数原型挂载close方法
        Modal.prototype.close = function () {
            // 将Modal框从页面body中移除
            // document.body.removeChild();
            this.modalBox.remove();
        }

        // 3. 点击删除按钮时
        document.querySelector('#delBtn').addEventListener('click', function () {
            // 调用Modal构造函数创建实例对象
            const del = new Modal('温馨提示', '您还没有删除权限');
            // 实例对象调用open方法
            del.open();
        });
        // 3. 点击登录按钮时
        document.querySelector('#loginBtn').addEventListener('click', function () {
            // 调用Modal构造函数创建实例对象
            const login = new Modal('友情提示', '您还没有注册呢');
            // 实例对象调用open方法
            login.open();
        });

    </script>
</body>

</html>
