<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 作用域
        // 全局作用域
        // 全局变量
        // 全局变量可以在任何地方访问
        // 全局变量的优先级最高

        let a = 1, b = 2;// 全局变量
        function f() {// 函数作用域
            let a = 3;// 函数变量
            function g() {// 函数作用域
                let a = 10;// 函数变量
                console.log(a);// 10 
            }
            g();// 10
        }
        // 函数作用域的变量级是最高
        // 函数作用域的变量可以在函数内部访问
        // 函数作用域的变量可以在函数外部访问
        f();// 3 
    </script>

</body>

</html>
