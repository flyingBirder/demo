<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const obj = {
            uname: 'yyi',
            sayHi: function () {
                console.log(this);// obj
                const fun = () => {
                    // 箭头函数没有自己的this,指向的是上一级作用域的this
                    console.log(this);// obj
                }
                // 调用箭头函数
                fun();
            }
        }
        obj.sayHi();






    </script>
</body>

</html>
