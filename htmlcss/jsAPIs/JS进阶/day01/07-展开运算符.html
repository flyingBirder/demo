<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 求数组的最大值
        const arr = [1, 2, 3, 4, 5];
        // 展开运算符: 可以将数组展开为多个参数
        console.log(...arr);// 1 2 3 4 5
        console.log(Math.max(...arr));// 5
        // 数组合并
        const arr1 = [1, 2, 3];
        const arr2 = [4, 5, 6];
        const arr3 = [...arr1, ...arr2];
        console.log(arr3);// [1, 2, 3, 4, 5, 6]
    </script>
</body>

</html>
