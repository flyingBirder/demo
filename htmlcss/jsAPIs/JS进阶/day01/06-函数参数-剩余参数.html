<!DOCTYPE html>

<body>
    <script>
        // 剩余参数: 函数可以接收任意数量的参数, 并将这些参数存储在一个数组中
        function fun(a, b, ...arr) {

            console.log(arr);// [3, 4, 5]
        }
        fun(1, 2, 3, 4, 5);
    </script>
</body>
