<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const obj = {
            name: '张三',
            age: 18,
            sex: '男',
            hobby: ['篮球', '足球', '跑步'],
            family: {
                baby: '小绿'
            }
        };
        // 利用JSON实现深拷贝
        // 1. 利用JSON.stringify()将对象转换为字符串, 
        // 2. 利用JSON.parse()将字符串转换为对象, 实现深拷贝
        const o = JSON.parse(JSON.stringify(obj));
        o.age = 22;
        o.hobby.push('游泳～～~');
        o.family.baby = '小蓝++--';
        console.log(o);
        console.log(obj);
    </script>

</body>

</html>
