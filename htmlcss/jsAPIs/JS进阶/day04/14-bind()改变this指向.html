<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="btn">点击禁用</button>
    <script>
        const obj = {};
        function fn() {
            console.log(this);// obj
        }

        // bind()方法不会立即调用函数，而是返回一个新的函数，新函数的 this 指向 obj
        const newFn = fn.bind(obj);
        newFn();// 调用新函数，this 指向 obj
        console.log(newFn);// 新函数的代码

        /* 
        需求：有一个按钮，点击后立马禁用，2秒后再启用
        */
        const btn = document.querySelector('#btn');
        btn.addEventListener('click', function () {
            this.disabled = true;// this 指向 btn
            //方法一： 箭头函数中的 this 指向定义时的环境
            setTimeout(() => {
                this.disabled = false;// this 指向 btn
            }, 2000);
            //方法二： 普通函数中的 this 指向调用时的环境
            /*  window.setTimeout(function () {
                 console.log(this);//this指向 window
                 btn.disabled = false;
             }, 2000); */

            // 方法三：
            window.setTimeout(function () {
                // 在普通函数中，我们需要把this由原来的window指向btn,可以使用bind()方法，它不会立即调用函数；
                // 千万不能用call()或apply()方法，因为它们会立即调用函数。
                this.disabled = false;// this 指向 btn
            }.bind(btn), 2000);
        });

        /* 
                document.querySelector('#btn').addEventListener('click', function () {
                    console.log(this);// this 指向 btn
                    this.disabled = true;// this 指向 btn
                    window.setTimeout(function () {
                        this.disabled = false;// this 指向 btn
                    }.bind(this), 2000);// 这里的this指向 btn
                });
         */

    </script>
</body>

</html>
