<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // location对象： 表示当前窗口的地址栏信息
        // 可以获取或设置当前窗口的地址栏信息
        // 常用属性： href、protocol、host、hostname、port、pathname、search、hash
        // 常用方法： reload()、replace()、assign()
        console.log(location.href); // http://127.0.0.1:8080/JScode/BOM/day01/12-location%E5%AF%B9%E8%B1%A1.html?name=张三&age=18#hash值
        console.log(location.protocol); // http:
        console.log(location.host); // 127.0.0.1:8080
        console.log(location.hostname); // 127.0.0.1
        console.log(location.port);// 8080
        console.log(location.pathname);
        console.log(location.search);// ?name=张三&age=18
        console.log(location.hash);// #hash值
    </script>
    <script>
        // location对象的常用方法： reload()、replace()、assign()
        // 刷新当前页面
        // location.reload();// true强制刷新， false默认刷新
        // 跳转到指定页面
        // location.href = 'https://www.baidu.com';
        // 跳转到指定页面，替换当前页面的历史记录，不添加当前页面的历史记录，没有后退按钮
        // location.replace('https://www.baidu.com');
        // 重定向页面， 跳转到指定页面，添加当前页面的历史记录，有后退按钮
        // location.assign('https://www.baidu.com');
    </script>

</body>
</html>
