<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>window.onload</title>
</head>
<body>
    <!-- 
        window.onload事件：当页面所有资源（包括图片、样式表等）加载完成后，触发该事件。
    1. 传统方式：
    window.onload = function() {
        // 页面所有资源加载完成后，执行的代码
        // 可以操作页面上的元素
    }
    2. 事件监听方式：
    window.addEventListener('load', function() {
        // 页面所有资源加载完成后，执行的代码
        // 可以操作页面上的元素
    })
    3. DOMContentLoaded事件：当页面DOM加载完成后，触发该事件。适合页面中大量图片等资源未加载完成时，需要操作DOM的场景。
    document.addEventListener('DOMContentLoaded', function() {
        // 页面DOM加载完成后，执行的代码
        // 可以操作页面上的元素
    })
    
    -->
    
</body>
</html>
