<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

</head>
<body>
    <script>

        // 1.BOM浏览器对象模型  : 浏览器对象模型（Browser Object Model，BOM）是指浏览器提供的一组对象，用于操作浏览器窗口和与浏览器进行交互。
        // 1.1 它是JS访问浏览器窗口的一个接口。
        // 1.2 它是一个全局对象。定义在全局作用域中的变量、函数都会变成window对象的属性或方法。
        // window.onload事件：当页面所有资源（包括图片、样式表等）加载完成后，触发该事件。
        // 2.BOM的组成部分 
        // 2.1 window对象：他是浏览器的顶级对象，所有全局变量、函数都属于window对象。window对象可以省略不写。window.name比较特殊，建议一般定义变量名不要使用name。
        // 2.2 navigator对象：
        // 2.3 screen对象：
        // 2.4 history对象
        // 2.5 location对象
        // 3.页面加载事件以及注意事项：
        // 3.1 页面加载事件：
        // 3.1.1 DOMContentLoaded事件：当HTML文档被完全加载和解析完成后，触发该事件，不包括样式表、图片、子框架等外部资源。
        // 3.1.2 load事件：当整个页面（包括所有依赖资源）加载完成后，触发该事件。
        // 3.2 注意事项：
        // 3.2.1 页面加载事件是异步执行的，不阻塞页面其他操作。
        // 3.2.2 可以使用addEventListener方法为页面加载事件添加监听函数。
        // 4.两种定时器：
        // 4.1  setTimeout()方法：用于在指定的毫秒数后执行一次指定的函数。
        // 4.2 setInterval()方法：用于按照指定的毫秒数间隔重复执行指定的函数。
        // 5.JS执行机制：
        // 5.1 单线程执行：JS引擎一次只能执行一个任务，按照代码的顺序依次执行。
        // 5.2 异步操作：一些耗时的操作（如网络请求、定时器）不会阻塞整个程序的执行，而是在操作完成后通过回调函数通知程序继续执行。
        // 5.3 事件循环：JS引擎通过事件循环机制来处理异步操作。事件循环会不断地检查任务队列，将准备好的任务放到执行栈中执行。
        // 6.使用location对象完成页面跳转：
        // 6.1 可以通过location对象来获取当前页面的URL信息。
        // 6.2 可以使用location.href属性来获取或设置当前页面的URL。
        // 6.3 可以使用location.reload()方法来重新加载当前页面。
        // 7.navigator对象：
        // 7.1 可以通过navigator对象来获取浏览器的相关信息。
        // 7.2 可以使用navigator.userAgent属性来获取浏览器的用户代理字符串。
        // 7.3 可以使用navigator.onLine属性来判断浏览器是否连接到互联网。
        // 8. history对象实现页面刷新：
        // 8.1 可以通过history对象来操作浏览器的历史记录。
        // 8.2 可以使用history.back()方法来返回上一页。
        // 8.3 可以使用history.forward()方法来前进到下一页。
        // 8.4 可以使用history.go()方法来跳转到指定的历史记录页面。
    </script>
    
</body>
</html>
