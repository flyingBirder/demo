<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拖拽显示隐藏模态框</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        a{
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }
        .login-header{
            margin: 0 auto;
            width: 200px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            cursor: pointer;
        }
        .login{

            display: none;
            width: 600px;
            height: 400px;
            background-color: #fff;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 99;
        }
        .login-title{
            position: relative;
            height: 50px;
            line-height: 50px;
            text-align: center;
            background-color: #ccc;
            cursor: move;
        }
        .login-title span{
            position: absolute;
            right: -10px;
            top: -10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #fff;

        }
        .login-input-content{
            margin-top: 50px;
            font-size: 24px;
            padding: 10px 30px;
            line-height: 50px;
        }
        .login-input input{
            height: 30px;
            width: 200px;
            vertical-align: middle;
        }
        .loginBtn{
            margin: 30px auto;
            width: 200px;
            height: 50px;
            color: #333;
            line-height: 50px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #ccc;
        }
        .login-bg{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);

        }
       
    </style>
</head>
<body>
    <div class="login-header">点击，弹出登陆框</div>
    <div class="login">
        <div class="login-title">登陆会员
            <span><a id="closeBtn" href="javascript:void(0)">关闭</a></span>
        </div>
        <div class="login-input-content">
            <div class="login-input">
                <label>用户姓名：</label>
                <input type="text" placeholder="请输入用户名">
            </div>
            <div class="login-input">
                <label>登陆密码：</label>
                <input type="password" placeholder="请输入密码">
            </div>
        </div>
        <div class="loginBtn"><a href="javascript:void(0)">登陆</a></div>
    </div>
    <!-- 遮盖层 -->
    <div class="login-bg"></div>
    <script>
        var login = document.querySelector('.login');
        var mask = document.querySelector('.login-bg');
        var loginHeader = document.querySelector('.login-header');
        var closeBtn = document.querySelector('#closeBtn');
        loginHeader.addEventListener('click',function(){
            login.style.display = 'block';
            mask.style.display = 'block';
        });
        closeBtn.addEventListener('click',function(){
            login.style.display = 'none';
            mask.style.display = 'none';
        });
        //
        var loginTitle = document.querySelector('.login-title');
        // 鼠标按下，获取鼠标在盒子内的坐标
        loginTitle.addEventListener('mousedown',function(e){
            var x = e.pageX - login.offsetLeft;
            var y = e.pageY - login.offsetTop;
            // 鼠标移动，鼠标在页面中的坐标减去鼠标在盒子内的坐标，就是盒子的坐标
            document.addEventListener('mousemove',move);
            function move(e){
                login.style.left = e.pageX - x + 'px';
                login.style.top = e.pageY - y + 'px';
            }
            // 鼠标松开，移除鼠标移动事件
            document.addEventListener('mouseup',function(){
                document.removeEventListener('mousemove',move);

            });
        });



    </script>
   
   
</body>
</html>
