<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算鼠标在盒子内的坐标</title>
    <style>
        .box{
            width: 300px;
            height: 300px;
            background-color: pink;
            margin: 100px auto;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <script>
        var box = document.querySelector('.box');
        var boxX = box.offsetLeft; // 盒子相对body左边框的距离
        var boxY = box.offsetTop; // 盒子相对body上边框的距离
        // 鼠标移动事件： mousemove
        box.addEventListener('click',function(e){
            // e 事件对象
            // e.pageX： 鼠标点击时，距离页面左边框的距离
            // e.pageY： 鼠标点击时，距离页面上边框的距离
            console.log(e.clientX ,e.pageX); // 鼠标点击时，距离浏览器窗口左边框的距离
            console.log(e.clientY ,e.pageY); // 鼠标点击时，距离浏览器窗口上边框的距离
            var x = e.pageX - this.offsetLeft; // 鼠标点击时，距离页面左边框的距离 - 盒子相对body左边框的距离
            var y = e.pageY - this.offsetTop; // 鼠标点击时，距离页面上边框的距离 - 盒子相对body上边框的距离
            this.innerHTML = '鼠标点击时，距离盒子左边框的距离：' + x  + '距离盒子上边框的距离：' + y;
        
        });
    </script>
    
</body>
</html>
