<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mouseenter事件不冒泡和mouseover事件冒泡</title>
    <style>
        .father{
            width: 300px;
            height: 300px;
            background-color: pink;
        }
        .son{
            width: 100px;
            height: 100px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="father">
        <div class="son"></div>
    </div>
    <script>
        var father = document.querySelector('.father');
        var son = document.querySelector('.son');
        // father.addEventListener('mouseenter',function(){
        //     console.log('mouseenter');// 鼠标移入父元素时触发，鼠标移入子元素不会触发，因为mouseenter事件不冒泡
        // });
        father.addEventListener('mouseover',function(){
            console.log('mouseover'); // 鼠标移入父元素时触发，鼠标移入子元素也会触发，因为mouseover事件冒泡
        });
    </script>
    
</body>
</html>
