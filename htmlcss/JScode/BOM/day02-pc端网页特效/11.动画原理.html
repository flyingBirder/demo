<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            position: absolute;
            left: 0;
            width: 100px;
            height: 100px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <!-- 动画原理：通过定时器不断改变元素的位置，从而实现动画效果 -->
     <!-- 1. 先获取盒子当前位置（offsetLeft）
          2. 当前位置 +1 改变盒子的位置（offsetLeft）
          3. 利用定时器不断重复2的操作 ，直到元素位置到达目标位置 setInterval()
          4. 当元素位置到达目标位置时，清除定时器 clearInterval()
          5. 注意：该元素必须添加定位属性（position: absolute;）才可以使用ele.style.left改变元素的位置
      
     -->
    <div class="box"></div>
    <script>
        var box = document.querySelector('.box');

         var timer = setInterval(function(){
            if(box.offsetLeft >= 400){
                clearInterval(timer);

            }else{
                box.style.left  = box.offsetLeft + 1 + 'px';
            }
        },10)
    </script>
    
</body>
</html>
