<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1.立即执行函数：不需要调用，立马执行
        function fn(){};
        fn();
        // 2.写法：可以传参数
       //1. (function(){})();   2.(function(){}());
       (function(a , b){
            console.log(a+b);
       })(1,2); // 第二个小括号：传递参数，可以看作是调用函数
       // 立即执行函数作用：立即执行函数可以创建一个独立的作用域，避免命名冲突
       (function sum(m,n){
            console.log(m+n);
       })(1,4);


    </script>
    
</body>
</html>
