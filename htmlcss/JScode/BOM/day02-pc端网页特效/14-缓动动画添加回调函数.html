<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sliderbar{
            position: absolute;
            right:0px;
            bottom: 250px;
            width: 40px;
            height: 40px;
            background-color: yellowgreen;
        }
        span{
            display: block;
            position: absolute;
            left: 0px;
            top: 0px;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
        }
        .con{
            position: absolute;
            left:0;
            bottom: 0;

            width: 160px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            background: yellowgreen;  
            font-size: 12px;
            color: #333;
            z-index: -100;
        }
    </style>
    <!-- 引入缓动动画函数 -->
    <script src="animate.js"></script>
</head>
<body>
    <div class="sliderbar">
        <span>⬅</span>
        <div class="con">问题反馈</div>
    </div>
    <script>
        var sliderbar = document.querySelector('.sliderbar');
        var con = sliderbar.querySelector('.con');
        // 鼠标移入时，将con向左移动160px
        sliderbar.addEventListener('mouseenter',function(){
           // animate(obj,target,callback);
            animate(con,-160,function(){
                // 动画执行完成后，将span的内容改为》
                sliderbar.children[0].innerHTML = '》'
            });
        });
        // 鼠标移出时，将con向右移动0px
        sliderbar.addEventListener('mouseleave',function(){
            animate(con,0,function(){
                sliderbar.children[0].innerHTML ='⬅'
            });
        });

    </script>
</body>
</html>
