<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 本地存储的特性：
     1.数据存储在用户浏览器中
     2.设置、读取方便，甚至在页面刷新后也不会丢失数据
     3.容量较大：sessionStorage约5MB,localStorage约20MB
     4.只能存储字符串，可以将对象进行JSON.stringify()转换后存储
    -->
     <!-- window.sessionStorage:
      1.生命周期为关闭浏览器窗口。
      2.在同一个页面下数据可以共享。
      3.以键值对的形式存储使用。
      1.存储数据：sessionStorage.setItem(key,value)
      2.读取数据：sessionStorage.getItem(key)
      3.删除数据：sessionStorage.removeItem(key)
      4.清空数据：sessionStorage.clear()
     
     -->
      <input type="text">
      <button class="set">存储数据</button>
      <button class="get">读取数据</button>
      <button class="remove">删除数据</button>
      <button class="clear">清空数据</button>
      <script>
        var input = document.querySelector('input');
        var setBtn = document.querySelector('.set');
        var getBtn = document.querySelector('.get');
        var removeBtn = document.querySelector('.remove');
        var clearBtn = document.querySelector('.clear');
        // 1.存储数据
        setBtn.onclick = function(){
          var value = input.value;
          sessionStorage.setItem('uname',value);//只要不关闭浏览器窗口，刷新页面存储的数据也不会丢失
        };

        getBtn.onclick = function(){
            var name = sessionStorage.getItem('uname');
            console.log(name);
        }
        removeBtn.onclick = function(){
            sessionStorage.removeItem('uname');
        }
        clearBtn.onclick = function(){
            sessionStorage.clear();
        }

      </script>
      <!-- localStorage:
      1.生命周期永久生效，除非手动删除,否则关闭页面也会存在。
      2.可以多窗口（页面）共享（同一浏览器可以打开多个页面）
      3.以键值对的形式存储使用。
      -->
      <!-- localStorage的使用方法与sessionStorage相同 -->
    
</body>
</html>
