<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 删除元素：node.removeChild(child); node 是父节点，child 是子节点,将 child 节点从 node 节点的子节点列表中删除 -->
    <button>依次删除li子元素</button>
    <ul>
        <li>111</li>
        <li>222</li>
        <li>333</li>
        <li>444</li>  
    </ul>
    <script>
        var btn = document.querySelector('button');
        var ul = document.querySelector('ul');
        var lis = ul.children;
        btn.onclick = function(){
            // 1.判断li元素是否为空
            if(lis.length === 0){
                alert('没有li子元素可以删除');
                this.disabled = true;
                return;
            }
            else{
                // 2.删除li元素
                ul.removeChild(lis[0]);
            }
            
        }
    </script>
    
</body>
</html>
