<body>
    <!-- 节点元素包括： 元素节点、属性节点、文本节点 -->
     <!-- 元素节点： 标签元素 -->
     <!-- 属性节点： 标签上的属性 -->
     <!-- 文本节点： 标签中的文本内容 -->
      <!-- 注释节点： 标签中的注释内容 -->
       <!-- 空格节点： 标签中的空格内容 -->
        <!-- 换行节点： 标签中的换行内容 -->
         <!-- 空节点： 标签中的空内容 -->
          <!-- 文档节点： 文档的根元素 -->
          <!-- 根节点： 文档的根元素 -->



          <!-- 节点关系： 节点之间的关系 -->
           <!-- 父节点： 包含当前节点的元素 -->
           <!-- 子节点： 被包含在当前节点中的元素 -->
            <p>父元素
                <a>子元素1</a>
                <span>子元素2</span>
            </p>
            <script>
                // 获取父元素
                var span = document.querySelector('span');

                 //parentNode 获取最近的父元素节点,如果找不到返回null
                 console.log(span.parentNode);



                // 获取所有子元素
                //不推荐： p.childNodes ; 获取所有子节点，包含所有节点，包括空格节点、换行节点等
                console.log(p.childNodes);
                 //开发中推荐 p.children ： 获取所有子元素节点
                 console.log(p.children);
               

                //1.不推荐 p.firstChild： 获取第一个子节点,包含所有节点，包括空格节点、换行节点等
                //1.不推荐 p.lastChild： 获取最后一个子节点,包含所有节点，包括空格节点、换行节点等
                console.log(p.firstChild);
                console.log(p.lastChild);
                //2.存在兼容问题： p.firstElementChild： 获取第一个子元素节点
                //2.存在兼容问题： p.lastElementChild： 获取最后一个子元素节点
                console.log(p.firstElementChild);
                console.log(p.lastElementChild);

                 //开3.发中推荐 p.children[i] ： 获取所有子元素节点
                 console.log(p.children[0]);// 第一个子元素节点
                 console.log(p.children[p.children.length - 1]);// 最后一个子元素节点
            </script>



           <!-- 兄弟节点： 拥有相同父节点的元素 -->
            <div>兄弟1111
            </div>
            <span>兄弟222</span>

            <script>
                var div = document.querySelector('div');
                // nextSibling： 下一个兄弟节点,包含所有节点
                // previousSibling： 上一个兄弟节点，包含所有节点
                console.log(div.nextSibling);
                console.log(div.previousSibling);
                // nextElementSibling： 下一个兄弟元素节点,
                // previousElementSibling： 上一个兄弟元素节点，
                 consle.log(div.nextElementSibling);
                 consle.log(div.previousElementSibling);

            </script>
    
</body>
