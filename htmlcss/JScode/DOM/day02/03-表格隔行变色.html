<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
            border: 0;
        }
        thead th{
            background-color: gray;
            border-bottom: 1px solid #000;
        }
       
        tbody tr{
            border-bottom: 1px solid #000;
        }
        .active{
            background-color: pink;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>姓名</th>
                <th>年龄</th>
                <th>性别</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>张三</td>
                <td>18</td>
                <td>男</td>
            </tr>
            <tr>
                <td>李四</td>
                <td>19</td>
                <td>女</td>
            </tr>
            <tr>
                <td>王五</td>
                <td>20</td>
                <td>男</td>
            </tr>
        </tbody>
    </table>
    <script>
        // 1.获取元素 tbody中所有的tr
        var trs = document.querySelector('tbody').getElementsByTagName('tr');
        // 2.利用循环遍历所有tr元素，绑定鼠标划过事件
        for(var i = 0;i<trs.length;i++){
            // 鼠标经过当前行时，添加背景颜色
            trs[i].onmouseover = function(){
                this.className = 'active';
            }
            // 鼠标离开当前行时，移除背景颜色
            trs[i].onmouseout = function(){
                this.className = '';
            }
        }
    </script>
</body>
</html>
