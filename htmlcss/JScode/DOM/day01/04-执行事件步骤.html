<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>执行事件步骤</title>
</head>
<body>
    <!-- 1.获取事件源 -->
     <!-- 2.绑定事件/注册事件 -->
     <!-- 3.触发事件 -->
    <div id="btn">点击我</div>
    <script>
        // 1.获取事件源
        var btn = document.getElementById('btn');
        // 2.绑定事件
        
        // 3.触发事件
        btn.onclick = function(){
            alert('hello');
        }
    </script>
     
</body>
</html>
