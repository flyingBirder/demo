<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件三要素</title>
</head>
<body>
    <button id="btn">点击我</button>
    
    <script>
        // 事件三要素：事件源、事件类型、事件处理函数
        // 事件源：事件触发的元素
        // 事件类型：事件的名称，例如click、mouseover等
        // 事件处理函数：事件触发时要执行的函数
        var btn = document.getElementById('btn');
        btn.onclick = function(){
            alert('hello');
        }
    </script>
    
</body>
</html>
