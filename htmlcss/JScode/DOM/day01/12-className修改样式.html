<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>className修改样式</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: pink;
        }
        .change{
            background-color: red;
            border-radius: 20px;
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <!-- 修改元素样式方法有两种： -->
    <!-- 1. element.style.属性 = 值 ;适合修改简单样式 -->
    <!-- 2. element.className = 值 ;适合修改多个样式 -->
    <div class="box">12345678990</div>
    <button>修改样式</button>
    <script>
        var btn = document.querySelector('button');
        var box = document.querySelector('.box');
        btn.onclick = function(){
            // 点击按钮后，将box的class属性值改为change
            box.className = 'change';
            // 点击按钮后，将box的class属性值改为box change
            box.className = 'box change';
        }
    </script>
    
</body>
</html>
