<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM简介</title>
</head>
<body>
    <!-- DOM：文档对象模型 -->
     <!-- DOM是一种用于HTML和XML文档的编程接口，它将文档表示为一个树状结构，每个节点都是一个对象 -->
      <!-- 每个对象都有属性和方法，开发人员可以使用这些属性和方法来操作文档的内容和结构 -->
       <!-- 开发人员可以使用DOM来动态地创建、修改和删除文档的元素、属性和内容 -->
        <!-- DOM的主要功能包括： -->
        <!-- 1.获取元素：开发人员可以使用DOM来获取文档中的元素，例如通过元素的ID、类名、标签名等 -->
        <!-- 2.修改元素：开发人员可以使用DOM来修改文档中的元素，例如改变元素的内容、属性、样式等 -->
        <!-- 3.创建元素：开发人员可以使用DOM来动态地创建新的元素，并将其添加到文档中 -->
        <!-- 4.删除元素：开发人员可以使用DOM来删除文档中的元素 -->
         <!-- 5.遍历元素：开发人员可以使用DOM来遍历文档中的元素，例如通过循环遍历所有的段落元素 -->
          <!-- 6.事件处理：开发人员可以使用DOM来处理文档中的事件，例如点击、鼠标移动、键盘输入等 -->
           <!-- 7.操作表单：开发人员可以使用DOM来操作文档中的表单元素，例如获取表单字段的值、提交表单等 -->

    <div id="time">12jj</div>
    
</body>
</html>
