<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示隐藏文本框内容</title>
    <style>
        input{
            width: 200px;
            height: 30px;
            margin-bottom: 10px;
            color: #999;
        }

    </style>
</head>
<body>
    <input type="text" value="手机">
    <script>
        // 1. 获取文本框元素
        var input = document.querySelector('input');
        // 2. 注册事件 获得焦点时onfocus 失去焦点时onblur
        input.onfocus = function(){
            if(this.value === '手机'){
                this.value = '';
            }
            //获得焦点文本框内容颜色加黑
            this.style.color = '#333';

        }
        // 3. 失去焦点时
        input.onblur = function(){
            if(this.value === ''){
                this.value = '手机';
            }
            //失去焦点文本框内容颜色变灰
            this.style.color = '#999';

        }
        
        
    </script>

    
</body>
</html>
