<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom事件流</title>
</head>
<body>
    <!-- 事件流：事件发生时会在元素节点之间按照特定的顺序传播，这个传播过程即 DOM 事件流 -->

    <!-- 事件流的三个阶段：捕获阶段 -> 目标阶段 -> 冒泡阶段 -->
    <!-- JS代码中只能执行捕获或者冒泡阶段，不能同时执行 -->
     <!-- onclick事件和attachEvent方法只能执行冒泡阶段 -->
      <!-- addEventListener方法,第三个参数值为true,表示 在事件捕获阶段执行；值为false 或者不写 ，表示在事件冒泡阶段执行； -->
       <!-- 事件冒泡：事件从最具体的元素开始触发，然后逐级向上传播到不具体的元素（document） -->
        <!-- 事件捕获：事件从不具体的元素（document）开始触发，然后逐级向下传播到最具体的元素 -->
         <!-- 实际开发中，我们更关注事件冒泡，很少使用事件捕获 -->
          <!-- 有些事件是没有事件冒泡的，比如：onblur、onfocus、onchange、onselect、onmouseenter、onmouseleave -->


</html>
