<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <p>我是一行注释，不会显示在浏览器中的。</p> -->
    <p>注释的作用：</p>
    <p>1. 注释的作用是对代码进行解释，方便其他开发者阅读和理解。</p>
    <p>2. 注释的内容不会被浏览器解析，也不会显示在页面上。</p>  
    <p>3. 注释可以用于临时禁用代码，方便调试和修改。</p>
    <p>4. 注释可以用于添加版权信息、作者信息、修改记录等。</p>  
    <p>5. 注释可以用于添加调试信息，方便开发人员定位问题。</p>
    <p>6. 注释可以用于添加必要的说明，帮助其他开发者理解代码的功能。</p>        




</body>
</html>
