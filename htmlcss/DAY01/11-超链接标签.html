<!DOCTYPE html>

    <title>超链接标签</title>
</head>
<body>
    <a href="https://t.bilibili.com/?spm_id_from=333.1007.0.0">点击跳转</a>
    <a href="https://www.baidu.com/">点击跳转到百度</a>
    <!-- 跳转到本地文件，按照相对路径查找 -->
    <a href="./09-图像标签.html">点击跳转图像标签页面</a>

    <!-- 开发初期不知道跳转链接的地址时，href属性值可以写#，空链接，不会跳转 -->

</body>
</html>
