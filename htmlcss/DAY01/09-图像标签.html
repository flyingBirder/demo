<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像标签</title>
</head>
<body>
    <img src="./dog.jpeg">
    <img src="./cat.jpeg">
    <img src="./rabbit.jpeg" alt="这是一张兔子的照片">
    <!-- alt用来解决网络加载缓慢时，图片无法显示的问题。 -->
    <img src="./cat.jpeg" title="猫咪">
    <!-- 鼠标悬停在图片上会出现提示属性title的值。 -->
    <img src="./dog.jpeg" width="200px">
    <!-- width属性用来设置图片的宽度。 -->
    <!-- 浏览器默认等比例缩放图片，保持图片的宽高比。 --> 
    <img src="./dog.jpeg" height="200px">
    <!-- height属性用来设置图片的高度。 -->

</body>
</html>
