<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>段落标签</title>
</head>
<body>
    <p>我是p标签,p是HTML中用于定义段落的块级元素，通过标签将文本组织成具有语义结构的段落单元。浏览器默认在段落前后添加垂直间距（上下各1em），该样式可通过CSS自定义字体、颜色、边距和对齐属性，支持全局属性和事件属性</p>    
    <p>我是p标签,该标签在HTML5标准中已废弃align对齐属性，推荐使用CSS实现文本排版控制 [5]。所有主流浏览器（Chrome/Edge/Firefox/Safari/Opera）均提供原生支持，默认行高为1.5倍字体大小且自动换行排版 [2-3] [7-8]。开发实践中建议通过设置margin属性控制段落间距，需使用标签强制换行，并适配不同终端的字体尺寸要求</p>


</body>
</html>
