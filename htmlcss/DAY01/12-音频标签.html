<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频标签</title>
</head>
<body>
    <!--在html5中，如果标签属性名和属性值完全一样，可以简写为一个单词 -->
    <!-- 属性controls 作用为在浏览器中显示音频面板-->
    <audio src="./多媒体/music.m4a" controls loop></audio>
    <!-- loop属性作用为循环播放 -->
     <!-- autoplay属性作用为自动播放,一般浏览器默认禁用自动播放，需要用户点击播放按钮使用 -->
     <audio src="音频路径" controls loop autoplay></audio>
    
</body>
</html>
