<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例一</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li{
            list-style: none;
        }
        .container{
            margin: 100px auto;
            width: 1200px;
            height: 480px;
            border: 1px solid #ddd;
            border-radius: 20px;
        }
        .container ul{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;

            padding: 80px 60px;
            height: 480px;

        }
        .container ul li{
            padding: 10px 0 0 20px;
            display: flex;
            width: 500px;
            height: 80px;
            background-color: pink;
        }

        img{
            width: 60px;
            height: 60px;
        }
        .container ul li .text{
            margin-left: 20px;
        }
        .container ul li .text h4{
            font-size: 20px;
            color: #333;
        }
        .container ul li .text p{
            font-size: 14px;
            color: #666;
        }




    </style>
</head>
<body>
   
    <div class="container">
        <ul>
            <li>
                <div class="pic">
                    <img src="./images/1.webp" alt="">
                </div>
                <div class="text">
                    <h4>一键发布</h4>
                    <p>发布文章到社交媒体，无需手动操作</p>
                </div>
            </li>
            <li>
                <div class="pic">
                    <img src="./images/2.webp" alt="">
                </div>
                <div class="text">
                    <h4>管理规范</h4>
                    <p>规范的发布管理，确保内容质量和一致性</p>
                </div>
            </li>
            <li>
                <div class="pic">
                    <img src="./images/1.webp" alt="">
                </div>
                <div class="text">
                    <h4>发布携带</h4>
                    <p></p>
                </div>
            </li>
            <li>
                <div class="pic">
                    <img src="./images/2.webp" alt="">
                </div>
                <div class="text">
                    <h4>数据评估</h4>
                    <p></p>
                </div>
            </li>
        </ul>







    </div>
    
</body>
</html>
