<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: flex;
            /* 更改主轴方向为垂直方向 */
            flex-direction: column;
            /* 主轴方向上：弹性盒子居中对齐 */
            justify-content: center;
            /* 侧轴方向上：弹性盒子居中对齐 */
            align-items: center;

            width: 200px;
            height: 200px;
            background-color: pink;
        }

        img{
            width: 32px;
            height: 32px;
            border-radius: 100%;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <img src="../DAY05/images/1.jpeg" alt="">
        <span>图片</span>
    </div>




    
</body>
</html>
