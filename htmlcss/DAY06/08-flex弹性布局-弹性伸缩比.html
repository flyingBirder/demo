<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹性伸缩比</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

             /* 默认情况下，主轴方向不设置尺寸默认由内容撑开，侧轴不设置尺寸默认拉伸。 */
       
        .container{
            height: 300px;
            border: 1px solid #000;
            display: flex;
            /* 改变主轴方向为垂直 */
            flex-direction: column;

        }
        .container div{
            /* height: 100px; */
            background-color: pink;
            /* flex:1; */
        }
        .container div:nth-child(1){
            flex:2;
        }
        .container div:nth-child(2){
            flex:3;
        }
        .container div:nth-child(3){
            flex:3;
        }

    </style>
</head>
<body>
    <div class="container">
        <div>111</div>
        <div>222</div>
        <div>333</div>
    </div>
    

    
</body>
</html>
