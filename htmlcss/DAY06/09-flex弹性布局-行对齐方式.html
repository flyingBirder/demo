<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹性换行</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: flex;
            /* 换行 */
            flex-wrap: wrap; 
            justify-content: space-between ;
            /* align-content改变行对齐方式：对单行弹性盒子不生效 */
            /* align-content: flex-start; */
            /* align-content: flex-end; */
            /* align-content: center; */
            /* align-content: space-around; */
             /* align-content: space-between; */
             align-content: space-evenly;
            height: 300px;
            border: 1px solid #000;
        }
        .container div{
            width: 200px;
            height: 100px;
            background-color: pink;
            
        }
            
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
    </div>
    
</body>
</html>
