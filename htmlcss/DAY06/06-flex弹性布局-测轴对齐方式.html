<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex测轴对齐方式</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            
            display: flex;
            height: 300px;
            background-color: greenyellow;
            /* align-items是给所有item设置对齐方式 */
            align-items: center;
            /* 弹性盒子在侧轴方向没有尺寸才可以拉伸 */
            /* align-items: stretch; */
            /* align-items: flex-start; */
            /* align-items: flex-end; */
        }
        /* 结构伪类选择器 */
        .container .item:nth-child(2){
            /* align-self是给单个item设置对齐方式 */
            align-self: center;
        }
        .container .item{
            width: 100px;
            height: 100px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
</body>
</html>
