<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子代选择器</title>
    <style>
        /* 子代选择器：选择所有指定元素的直接子元素 */
        div>span {
            color: #0069c2;
        }
    </style>
</head>

<body>
    <div>
        <span>我是儿子span1</span>
        <p>ggg
            <span>我是孙子span</span>
        </p>
        <span>我是儿子span2</span>
    </div>

</body>

</html>
