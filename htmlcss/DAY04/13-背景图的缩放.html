<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景图的缩放</title>
    <style>

        div{
            width: 600px;
            height: 600px;
            background-color: palegreen;
            background-image: url(./image/2.jpeg);
            background-repeat: no-repeat;
            background-position: 0 0;
            /* 背景图缩放 contain 等比例缩放，如果图片的宽或者高跟盒子的尺寸相等，就会停止缩放，可能会产生盒子有一部分空白 */
            /* background-size: contain; */
            /* 背景图缩放 cover 等比例缩放，图片完全覆盖盒子，可能会裁剪图片显示不全 */
            /* background-size: cover; */
            /* 背景图缩放 100% 图片会拉伸到盒子的尺寸，相单于图片的宽度和盒子的宽度一样，图片的高度会等比例缩放到盒子的高度。这样图片会被拉伸变形 */
            background-size: 100%;
        }
    </style>
</head>
<body>
    <div>我是div,我有背景图</div>
    
</body>
</html>
