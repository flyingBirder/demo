<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Emmet写法</title>
   <style>

   </style>
</head>

<body>
   <!-- div.box回车 -->
   <div class="box">div.box</div>
   <!-- div#box回车 -->
   <div id="box">div#box</div>
   <!-- div+p回车 -->
   <div></div>
   <p></p>
   <!-- div>p回车 -->
   <div>
      <p></p>
   </div>
   <div>
      <p></p>
   </div>
   <!-- div{div元素} 回车-->
   <div>jjj</div>
   <div>ggg</div>

   <!-- div+ul>li*3 回车-->
   <div></div>
   <ul>
      <li></li>
      <li></li>
      <li></li>
   </ul>
   <!-- div>ul>li*4 回车-->
   <div>
      <ul>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
      </ul>
   </div>
   <!-- ul>li*4>a{链接$} 回车 -->
   <ul>
      <li><a href="javascript:;"></a></li>
      <li><a href="javascript:;"></a></li>
      <li><a href="javascript:;"></a></li>
      <li><a href="javascript:;"></a></li>
   </ul>

</body>

</html>
