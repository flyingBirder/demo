<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示模式</title>
    <style>
        /* 块级元素：1. 独占一行 2. 设置宽高生效 3.宽度默认是父元素的宽度 */
        div{
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
        }
        .box1{
            background: pink;
        }
        .box2{
            background: palegoldenrod;
        }
        /* 行内元素：1. 不独占一行,一行可以有多个 2. 设置宽高不生效 3.尺寸由内容撑开*/
        a{
            color:red
        }
        span{
            width: 200px;
            height: 200px;
        }
        .span1{
            background: palegreen;
        }
        .span2{
            background: paleturquoise;
        }
        /* 行内块元素：1. 不独占一行,一行可以有多个 2. 设置宽高生效 3.尺寸由内容撑开*/
        img{
            width: 200px;
            height: 200px;
        }
        input{
            width: 100px;
        
        }

        /* 使用display属性可以实现显示模式的转换：1. 块级元素可以转换为行内元素 2. 行内元素可以转换为块级元素 3. 行内块元素可以转换为块级元素 */
        /* 转换为行内元素 */
        div{
            display: inline-block;
        }
        /* 转换为块级元素 */
        span{
            display: block;
        }
        /* 转换为行内块元素 */
        img{
            display: block;
        }
        input{display: block;}
    </style>
</head>
<body>
    <!-- 块级元素 -->
    <div class="box1">
        我是一个盒子
    </div>
    <div class="box2">
        我是第二个盒子
    </div>
    <!-- 行内元素 -->
     <span class="span1">我是第一个span元素</span>
     <span class="span2">我是第二个span元素</span>
     <a href="#">这是第一个链接</a><a href="#">这是第二个链接</a>
     <!-- 行内块元素 -->
      <img src="./image/2.jpeg" alt="这是一一个图片">
      <img src="./image/3.jpeg" alt="这是第二个图片">
      <input type="text">
      <input type="text">
</html>
