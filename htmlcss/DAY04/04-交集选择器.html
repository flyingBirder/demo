<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交集选择器</title>
    <style>
        /* 交集选择器：选择同时符合多个条件的元素 */
        /* 选择所有类名为box的div元素 */
        
        div.box{
            color: red;
        }

    </style>
</head>
<body>
    <div class="box">我是一个有类名的div元素</div>
    <div>我是一个div元素</div>
    <p class="box">我是一个有类名的p元素</p>
    
</body>
</html>
