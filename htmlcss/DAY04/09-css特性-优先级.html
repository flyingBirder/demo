<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优先级</title>
    <style>
        /* 优先级：当多个选择器同时作用于一个元素时，根据一定的规则，确定最终的样式 */
        /* 优先级规则：
            1. 行内样式 > 内部样式表 > 外部样式表
            2. 相同优先级的样式，后写的样式会覆盖先写的样式
            3. !important 声明的样式，优先级最高
    优先级的公式：!important >行内样式 > ID选择器 > 类选择器 > 伪类选择器 > 属性选择器 > 伪元素选择器 > 元素选择器 > 通配符选择器
        */
        *{
            color:#333;
        }
        div{
            color: aquamarine;
        }
        .box{
            color: blueviolet;
        }

        #boxdiv{
            color: yellowgreen;
        }

        div{
            color: green !important;
            
        }

    </style>
</head>
<body>
    <div class="box" id="boxdiv" style="color: red;">我是一个div元素</div>
</body>
</html>
