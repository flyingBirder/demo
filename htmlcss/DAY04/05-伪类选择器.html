<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪类选择器</title>
    <style>
        /* 伪类选择器：选择元素的特定状态或位置 */
        /* 选择所有类名为box的div元素 */
        /* 任何标签都可以使用伪类选择器，选择器:hover 表示鼠标悬停在元素上时的状态 */
        div.box:hover {
            color: red;
        }
        a:hover {
            color: red;
        }
    </style>
</head>
<body>
    <div class="box">我是一个div元素</div>
    <a href="#">点击跳转到百度</a>
    
</body>
</html>
