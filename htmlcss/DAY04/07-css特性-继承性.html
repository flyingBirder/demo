<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>继承性</title>
    <style>
      
        body {
            color: red;
        }
    </style>
</head>
<body>
     <div>
        div标签中的p标签会继承div的颜色
        <p>我是div中的p标签</p>
    </div>
     <p>我是body中的p标签</p>
     <a href="#">我是超链接，自身带有样式，不继承body的颜色</a>
</body>
</html>
