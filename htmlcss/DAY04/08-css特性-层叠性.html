<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>层叠性</title>
    <style>
        /* 层叠性：当多个选择器同时作用于一个元素时，根据一定的规则，确定最终的样式 */
        /* 层叠性规则：
            1. 行内样式 > 内部样式表 > 外部样式表
            2. 相同优先级的样式，后写的样式会覆盖先写的样式
        */
        div {
            color: red;
            font-size: 20px;
        }
        div{
            font-weight: 700;
            color: blueviolet;
        }
    </style>
</head>
<body>
    <div>woshi div标签</div>
    
</body>
</html>
