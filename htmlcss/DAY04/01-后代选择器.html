<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后代选择器</title>
    <style>
        /* 后代选择器：选择所有指定元素的后代元素 */
        /* 后代选择器：选择所有的后代元素，包括儿子，孙子，重孙子。。。 */
        div span {
            color: #0069c2;
        }
    </style>
</head>

<body>
    <span>我是父级span</span>
    <div>
        <span>我是儿子span
            <span>我是孙子span</span>
        </span>
        <p>ggg
            <span>我是孙子span</span>
        </p>
    </div>


</body>

</html>
