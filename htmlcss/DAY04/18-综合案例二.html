<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例二</title>
    <style>
        .banner{
            height: 800px;
            background-color: #f3f4f4;
            background-image: url(./image/4.jpeg);
            background-repeat: no-repeat;
            background-position: left bottom;
            background-size: contain;
            /* 文字控制属性可继承给子级 */
            text-align: right;
            color:#333;
        }
        .banner h2{

            font-size: 36px;
            font-weight: 400;
            line-height: 100px;
        }
        .banner p{
            font-size: 20px;
        }
        .banner a{
            display: inline-block;
            width: 125px;
            height: 40px;
            background-color: #f06b1f;
            text-align: center;
            line-height: 40px;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h2>这是一个banner</h2>
        <p>这是一这是一个段落这是一一个段落这是一个段落这是一个段落个段落</p>
        <a href="#">联系我们</a>
    </div>
    
</body>
</html>
