<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体图标的使用</title>
    <link rel="stylesheet" href="./iconfont/iconfont.css">
    <style>
        /* 要选择优先级高的类选择器.iconfont，更改字体图标的颜色大小，需要设置font-size和color属性 */
        span.iconfont{
            font-size: 30px;
            color: red;
        }
    </style>
</head>
<body>
    <!-- 字体图标:展示的是图标，实际本质是字体 。作用：在网页中添加简单的纯色的小图标 -->
     <!-- 优点：1.图标是矢量图，不会失真 2.灵活性：图标可以任意改变颜色尺寸 3.轻量级：体积小渲染块，降低页面加载时间4.兼容性好，支持所有现代浏览器 5.易于使用：先下载字体图标库，然后在HTML中引入字体文件，最后使用CSS设置图标样式 -->
    <span class="iconfont icon-favorite"></span>
    <span class="iconfont icon-good"></span>

    <!-- 如果iconfont字体图标库没有要用的图标，需要设计师绘制svg图标然后从本地上传至图标库然后转换为字体图标 -->
</body>
</html>
