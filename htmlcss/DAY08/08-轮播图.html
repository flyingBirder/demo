<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="轮播图">
    <meta name="description" content="轮播图，图片切换，自动播放，手动切换">
    <title>轮播图</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./iconfont/iconfont.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        body{
            background-color: #000;
        }
        li{
            list-style: none;
        }
        .banner{
            position: relative;
            margin: 100px auto;
            width: 564px;
            height: 315px;
             /* 轮播图水平平列后，超出部分隐藏 */
             overflow: hidden;
        }
        .banner ul {
            /* 轮播图水平平列 */
            display: flex;
        
        }
        .banner img{
            width: 564px;
            height: 315px;

            border-radius: 15px;
            /* 解决图片底部有空白缝隙问题 */
            vertical-align: middle;
        }
        /* 箭头 */
        .banner .prev,.banner .next{
            /* 默认隐藏不显示 */
            display: none;
            width: 20px;
            height: 30px;
            line-height: 30px;
            background-color: rgba(0,0,0,.3);
            /* 绝对定位 */
            position: absolute;
            top:50%;
            /* 垂直居中定位 */
            transform: translateY(-50%);
            text-decoration: none;
            color: #fff;

            
        }
        /* 鼠标悬停在banner区域箭头出现 */
        .banner:hover .prev,
        .banner:hover .next{
            display: block;
        }

        .banner .prev{           
            left:0;
            border-radius: 0 15px 15px 0;
        }
        .banner .next{
            right:0;
            border-radius: 15px 0 0 15px;
            text-align: center;
        }
        /* 圆点 */
        .banner ol{
            position: absolute;
            left:50%;
            transform: translateX(-50%);
            bottom:20px;
            /* height: 13px; */
            background-color: rgba(255,255,255,.3);
            border-radius: 10px;
            display: flex;

        }
        .banner ol li{
            width: 8px;
            height: 8px;
            background-color: #ddd;
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
            line-height: 8px;
        }
        .banner ol li.active{
            background-color: #ff6600;
        }


    </style>
</head>
<body> 
    <div class="banner">
        <ul>
            <li><a href="#"><img src="./images/banner.webp" alt=""></a></li>
            <li><a href="#"><img src="./images/banner.webp" alt=""></a></li>
            <li><a href="#"><img src="./images/banner.webp" alt=""></a></li>    
        </ul>
        <!-- 左右箭头切换 -->
         <a href="#" class="prev"><span class="iconfont icon-arrow-right"></span></a>
         <a href="#" class="next"><span class="iconfont icon-arrow-right"></span></a>
         <!-- 圆点 -->
         <ol>
            <li></li>
            <li class="active"></li>
            <li></li>
        </ol>
    </div>
    
</body>
</html>
