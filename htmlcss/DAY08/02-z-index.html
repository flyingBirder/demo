<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>堆叠顺序z-index</title>
    <style>
        div{
            position: absolute;
            width: 200px;
            height: 200px;

        }

        /* 堆叠顺序z-index: 数值为整数，默认为0，数值越大, 越在上面; */
     .box1{
       
        background-color: palegoldenrod;
        z-index:1;

     }
     .box2{
        
        background-color: palegreen;
        z-index: 9;
     }

      
    </style>
</head>
<body>
<div class="box1"></div>
<div class="box2"></div>
   

   
</body>
</html>
