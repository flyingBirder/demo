<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vw/vh</title>
    <link rel="stylesheet" href="vw.css">
</head>
<body>
    <!-- vw/vh:是相对视口宽高计算结果的单位，可以直接实现移动端适配，响应式布局 -->
    <div class="box">
        vw:相对视口宽度的单位
        vh:相对视口高度的单位
        1vw=1%视口宽度
        1vh=1%视口高度

        计算公式：vw单位的尺寸=px单位的尺寸/视口宽度*100



        
    </div>
    <!-- 开发中不推荐vw 和vh混用 -->

    
</body>
</html>
