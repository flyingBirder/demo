<!DOCTYPE html>

    <title>less</title>

<body>
    
    <div >
        less:
        1.less是css的预处理器，less文件需要编译成css文件才能使用。
        2.less文件的后缀名是.less
        3.less文件中可以使用变量、嵌套、混合、函数等特性。
        4.less文件中可以使用注释。
        5.less文件中可以使用@import引入其他less文件。
        6.less文件中可以使用变量。

    </div>
</body>
</html>
