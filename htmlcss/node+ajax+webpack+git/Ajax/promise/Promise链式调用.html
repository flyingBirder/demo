<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 需求：使用setTimeout模拟实现链式调用 -->
    <script>
        const p = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve('success');
            }, 2000);
        })
        const p2 = p.then(res => {
            console.log(res);
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve('success2');
                }, 2000);
            });
        });
        p2.then(res => {
            console.log(res);
        });
        console.log(p === p2);
        // 1. 每个then()方法都返回一个新的Promise实例
        // 2. 新的Promise实例的状态由回调函数的执行结果决定
        // 3. 新的Promise实例的结果由回调函数的返回值决定

    </script>
</body>

</html>
