<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./index.css">
    <title>master分支标题</title>
</head>

<body>
    <div class="wrap">
        <!-- 侧边栏 -->
        <div class="aside">
            <ul>
                <li>内容管理</li>
                <li>文章列表</li>
            </ul>
        </div>
        <!-- 右侧区域 -->
        <div class="main">
            <!-- 顶部导航 -->
            <div class="top-nav">
                <div class="nav-item">
                    <span class="nickname"></span>
                    <span class="quick"> 退出</span>
                </div>
            </div>
            <div class="content">
                <!-- 内容管理 -->
                <form class="form-content">
                    <div class="form-title">内容管理</div>

                    <div class="form-group">
                        <label class="form-label">状态:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="status" id="all" value="">
                            <label class="form-check-label" for="all">
                                全部
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="status" id="pending" value="1">
                            <label class="form-check-label" for="pending">
                                待审核
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="status" id="approved" value="2">
                            <label class="form-check-label" for="approved">
                                审核通过
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">频道:</label>
                        <select class="form-select" name="channel_id" id="channel_id">
                            <option value="">请选择频道</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary sel-btn" type="button">筛选</button>
                    </div>
                </form>
                <!-- 文章列表 -->
                <table class="article-list">
                    <thead>
                        <tr>
                            <th>封面</th>
                            <th>标题</th>
                            <th>状态</th>
                            <th>发布时间</th>
                            <th>阅读数量</th>
                            <th>评论数量</th>
                            <th>点赞数量</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody class="align-middle art-list">
                        <!-- 循环展示文章列表 -->
                    </tbody>
                </table>
                <!-- 分页 -->
                <nav>
                    <ul class="pagination">
                        <li class="page-item last"><a class="page-link" href="#">《</a></li>
                        <li class="page-item page-now"><a class="page-link" href="#">第1页</a></li>
                        <li class="page-item next"><a class="page-link" href="#">》</a></li>
                        <li><span class="total-count page-now">共0条</span></li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../utils/request.js"></script>
    <script src="../../utils/auth.js"></script>
    <script src="./index.js"></script>
</body>

</html>
