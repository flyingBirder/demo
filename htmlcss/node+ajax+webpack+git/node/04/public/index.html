<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时钟案例</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-image: linear-gradient(to bottom right, red, gold);
        }

        .box {
            width: 400px;
            height: 250px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            position: absolute;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            box-shadow: 1px 1px 10px #fff;
            text-shadow: 0px 1px 30px white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 70x;
            user-select: none;
            padding: 0 20px;
            -webkit-box-reflect: below 0px -webkit-gradient(linear, left top, left bottom, from(transparent), color-stop (0%, transparent) to(rgba(0, 0, 0, 0.5)));
        }
    </style>
</head>

<body>
    <div class="box">
        <div id="hour">00</div>
        <div>:</div>
        <div id="minute">00</div>
        <div>:</div>
        <div id="second">00</div>

    </div>

    <script>
        window.addEventListener('load', () => {
            Clock();
            setInterval(Clock, 1000);

        })
        function Clock() {
            let dt = new Date();
            let hour = dt.getHours();
            let minute = dt.getMinutes();
            let second = dt.getSeconds();
            document.getElementById('hour').innerHTML = PadZero(hour);
            document.getElementById('minute').innerHTML = PadZero(minute);
            document.getElementById('second').innerHTML = PadZero(second);
        }
        function PadZero(num) {
            return num < 10 ? '0' + num : num;
        }

    </script>

</body>

</html>
