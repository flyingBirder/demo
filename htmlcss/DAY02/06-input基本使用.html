<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input基本使用</title>
</head>
<body>
    请您输入姓名：<input type="text" placeholder="请输入您的姓名">
    <br>
    <br>
    请您输入密码：<input type="password" placeholder="请输入您的密码">
    <br>
    <br>
    请选择您的性别：<input type="radio" name="gender">男
    <input type="radio" name="gender" checked>女 
    <!-- checked 表示默认选中 -->
    <br>
    <br>
    请选择您的爱好：<input type="checkbox">瑜伽
    <input type="checkbox" checked>跑步
    <input type="checkbox" checked>骑行
    <!-- checked 表示默认选中 -->
    <br>
    <br>
    请输入您的年龄：<input type="number" placeholder="请输入您的年龄" min="0" max="120">
    <br>
    <br>
    请选择您的出生日期：<input type="date" required title="请选择您的出生日期">
    <br>
    <br>
    请输入您的邮箱：<input type="email" placeholder="请输入您的邮箱" required>
    <br>
    <br>
    请输入您的手机号：<input type="tel" placeholder="请输入您的手机号" required pattern="1[3-9]\d{9}" title="请输入正确的手机号">
    <br>
    <br>
    请输入您的地址：<input type="text" placeholder="请输入您的地址">
    <br>
    <br>
    请选择您的头像：<input type="file" multiple required title="请选择您的头像">
    <!-- multiple 表示可以选择多个文件 -->
    <br>
    <br>    
    <input type="submit" value="提交">
    <input type="reset" value="重置">
    <input type="button" value="按钮" onclick="alert('您点击了按钮')" title="点击我">
</body>
</html>
