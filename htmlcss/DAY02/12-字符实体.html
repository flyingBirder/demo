<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字符实体</title>
</head>
<body>
    <!-- 字符实体表示特殊字符，不能直接输入，需要使用实体名称或实体编号来表示 -->
     <!-- 空格实体：&nbsp; -->
      <!-- 大于号实体：&gt; -->
       <!-- 小于号实体：&lt; -->
        <!-- 换行实体：&nbsp; -->
         <!-- 在代码中敲空格键，浏览器只识别为一个空格实体 -->
          
     <p>我是p标签，包含空格&nbsp;</p>
     <p>我是p标签，包含大于号&gt;</p>
     <p>我是p标签，包含小于号&lt;</p>
     <p>我是p标签，包含空格开端&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;空格末尾</p>
     <p>我要输出&lt;div&gt;</p>
</body>
</html>
