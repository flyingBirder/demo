<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多行输入文本域</title>
</head>
<body>
    <textarea name="textarea" id="" cols="30" rows="10" placeholder="请输入您的留言..."></textarea>
    <!-- placeholder 表示占位符 -->
     <!--文本域的尺寸大小可以通过 cols 和 rows 来设置，但是实际工作中一般采用 CSS 来设置 -->
     <!-- 文本域的右下角有一个可以拖拽的小方块，用来调整文本域的大小，但是未来实际工作中一般会禁用此功能 -->
     
</body>
</html>
