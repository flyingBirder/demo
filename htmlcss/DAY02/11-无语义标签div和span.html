<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无语义标签div和span</title>
</head>
<body>
    <!-- div 标签表示块级元素，独占一行 -->
     <!-- 可以在div标签中包裹其他块级元素，比如文字、图片等 -->
    <!-- div 标签可以设置宽度、高度、背景颜色、边框等样式 -->
    <div style="height: 300px;">
        我是独占一行的标签
    </div>
    <div>
        我是独占一行的标签
    </div>
    <span style="display: inline-block;width: 300px;">
        我是不独占一行的标签span1,我和其他span标签在同一行
    </span>
    <span style="display: block;height: 300px;">
        我是不独占一行的标签span2,
    </span>
    <!-- span 标签表示行内元素，和其他span标签在同一行 -->
     <!-- 可以在span标签中包裹其他行内元素，比如文字、图片等 -->
  
</body>
</html>
