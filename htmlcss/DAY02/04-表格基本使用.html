<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格基本使用</title>
</head>
<body>
    <!-- 表格的基本使用 -->
    <table border="1">
        <tr>
            <th>姓名</th>
            <th>年龄</th>
            <th>性别</th>
        </tr>
        <tr>
            <td>张三</td>
            <td>18</td>
            <td>男</td>
        </tr>
        <tr>
            <td>李四</td>
            <td>19</td>
            <td>男</td>
        </tr>
        <tr>
            <td>王五</td>
            <td>20</td>
            <td>男</td>
        </tr>
    </table>
    <!-- 表格结构标签 thead tbody tfoot -->
    <table border="1">
        <thead>
            <tr>
                <th>姓名</th>
                <th>语文</th>
                <th>数学</th>
                <th>总分</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>张三</td>
                <td>99</td>
                <td>100</td>
                <td>199</td>
            </tr>
            <tr>
                <td>李四</td>
                <td>89</td>
                <td>100</td>
                <td>189</td>
            </tr>
            <tr>
                <td>王五</td>
                <td>90</td>
                <td>95</td>
                <td>185</td>
            </tr>
        </tbody>  
        <tfoot>
            <tr>
                <td>总结</td>
                <td>全市第一</td>
                <td>全市第一</td>
                <td>全市第一</td>
            </tr>
        </tfoot>     
    </table>
    
</body>
</html>
