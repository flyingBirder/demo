<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下拉菜单</title>
</head>
<body>
    请选择您所在城市：<select name="city" id="">
        <!-- <option value="">请选择您所在城市</option> -->
        <option value="">北京</option>
        <option value="">上海</option>
        <option value="">杭州</option>
        <option value="" selected value="武汉">武汉</option>
        <!-- value 表示提交给服务器的值，selected 表示默认选中 -->
    </select>
    
</body>
</html>
