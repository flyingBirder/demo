<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单按钮</title>
</head>
<body>
    <!-- form 标签表示表单区域，button标签必须放在form标签中c才生效，action 属性表示表单提交的地址 -->
    <!-- button 标签表示按钮，type 属性表示按钮的类型，有 submit、reset、button 三种类型 -->
     <!-- submit 类型的按钮表示提交表单，reset 类型的按钮表示重置表单，button 类型的按钮表示普通按钮 -->
      <!-- 普通按钮的 type 属性可以省略不写，默认就是 button 类型 -->
    <form action="">
        请输入您的姓名：<input type="text">
        <br>
        <br>
    
        请输入您的密码：<input type="password">
        <br>
        <br>
    <!-- 提交按钮的 type 属性可以省略不写，默认就是 submit 类型 -->
         <button>提交</button>
         <button type="submit">提交</button>
         <button type="reset">重置</button>
         <button type="button">普通按钮</button>

    </form>
   
</body>
</html>
