<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            transition: all;
            width: 200px;
            height: 200px;
            background-color: red;
            /* transform: scale(2);
            transform: scale(1); */

        }
        .box:hover{
            /* 缩放：transform: scale(数值);只写一个值表示水平垂直等比例缩放 */
            
            /* 数值大于1:放大 */
            /* transform: scale(2); */

            /* 数值小于1:缩小 */
            /* transform: scale(0.5); */

            /* 数值等于1:原始大小 */
            transform: scale(1);

        }
    </style>
</head>
<body>
    <div class="box"></div>
    
</body>
</html>
