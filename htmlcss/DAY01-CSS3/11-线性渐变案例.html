<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            position: relative;
            width: 300px;
            height: 536px;
            background-color: pink;
        }
        .box img{
            width: 100%;
            height: 536px;
        }
        .box .title{
            width: 100%;
            position: absolute;
            left:0;
            bottom: 0;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            transition: all .5s;
            text-align: center;
            margin-bottom: 20px;
        }
        .mask{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 线性渐变:透明--黑色半透明 */
            background-image: linear-gradient(transparent,rgba(255,255,255,.3));
            transition: all .5s;
            opacity: 0;
            transition: all .5s;
         }

         .box:hover .mask{
            opacity: 1;
            cursor: pointer;
         }
         .box:hover .title{
            transform: scale(1.2);
         }
    </style>
</head>
<body>
    <div class="box">
        <img src="./images/city.jpeg" alt="">
        <div class="title">唯有城市美景可消愁</div>
        <div class="mask"></div>

    </div>
</body>
</html>
