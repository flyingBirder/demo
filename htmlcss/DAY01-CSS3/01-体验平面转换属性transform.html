<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: pink;
            /* 过渡属性 */
            transition: all;
        }
        /* 鼠标悬停时，div元素发生转换 */
        /* 转换属性：translate、rotate、scale、skew */
        div:hover{
            transform: translate(100px,100px) rotate(45deg) scale(1.5) skew(30deg,30deg);
        }
    </style>
</head>
<body>
    <div></div>
    
</body>
</html>
