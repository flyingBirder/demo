<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .clock{
            margin: 0 auto;
            position: relative;
            width: 970px;
            height: 970px;
            border: 8px solid #333;
            border-radius: 50%;
            /* background-image: url(./images/clock.gif); */
        }

        .cover{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 700px;
            height: 700px;
            background-color: #fff;
            border-radius: 50%;
            z-index: 10;
        }
        .line{
            position: absolute;
            width: 8px;
            height: 970px;
            background-color: #999;
            left: 49.4%;
            top:0%;
            transform: translate(-50%);
            
        }
        .line:nth-child(2){
            transform: translate(-50%) rotate(30deg);
        }
        .line:nth-child(3){
            transform: translate(-50%) rotate(60deg);
        }
        .line:nth-child(4){
            transform: translate(-50%) rotate(90deg);
        }
        .line:nth-child(5){
            transform: translate(-50%) rotate(120deg);
        }
        .line:nth-child(6){
            transform: translate(-50%) rotate(150deg);
        }





        .hour,.minute,.second{
            position: absolute;
            bottom: 50%;
            left: 50%;

            transform-origin: center center;
            z-index: 10;


        }
       .hour{
            
            width: 10px;
            height: 120px;
            background-color: #333;
            margin-left: -18px;
            margin-bottom: -49px;

            transform-origin: center bottom;
            transform: rotate(360deg);


       }
       .minute{
            
            width: 8px;
            height: 160px;
            background-color: #333;
            margin-left: -18px;
            margin-bottom: -49px;

            transform-origin: center bottom;
            transform: rotate(150deg);

       }
       .second{
           
            width: 6px;
            height: 240px;
            background-color: red;
            margin-left: -18px;
            margin-bottom: -49px;

            transform-origin: center bottom;
            transform: rotate(90deg);




       }

       .dotted{
            margin-top: 47px;
            margin-left: -13px;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background-color: #333;
            border-radius: 50%;
            transform: translate(-50%,-50%);
            z-index: 100;
       }
      
    </style>
</head>
<body>
    <div class="clock">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>

        <!-- 遮罩封面 -->
        <div class="cover"></div>
        <!-- 时钟指针 -->
        <div class="hour"></div>
        <div class="minute"></div>
        <div class="second"></div>
        <div class="dotted"></div>
    </div>
   
</body>
</html>
