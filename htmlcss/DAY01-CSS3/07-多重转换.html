<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多重转换：先平移后旋转</title>
    <style>
        .box{
            width: 800px;
            height: 200px;
            background-color: pink;
           
        }
        .son{
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            transition: all 5s ;
        }
        /* 鼠标悬停时,子元素边走边转*/
        .box:hover .son{
            /* 1.先平移后旋转2.必须写成复合属性 */
            transform: translate(600px) rotate(720deg);



            /* 层叠性 */
            /* transform: translate(600px) ;
            transform: rotate(360deg); */
        }
    </style>
</head>
<body>
    <div class="box">
       <div class="son"></div>
    </div>
    
</body>
</html>
