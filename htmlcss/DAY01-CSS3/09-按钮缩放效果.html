<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul,li{
            list-style: none;
        }
        .box{
            margin: 100px auto;
            width: 300px;
            height: 260px;
        }
        /* 摆放播放按钮到图片中心位置 */
        .box ul li{
            overflow: hidden;
        }
        .box .pic{
            position: relative;

        }
        .box img{
            width: 100%;
            height: 100%;
        }
        .box p{
            text-align: center;
            padding: 10px auto;
        }

        .box .pic::after{
            position: absolute;
            top: 50%;
            left: 50%;
            /* margin-top: -29px;
            margin-left: -29px; */

            /* 会产生属性层叠，不建议 */
            /* transform: translate(-50%,-50%); */
            /* transform: scale(5); */

            /* 可以写成复合属性 */
            transform: translate(-50%,-50%) scale(5);

            content: '';
            width: 58px;
            height: 58px;
            background-image: url(./images/play.jpg);
            opacity: 0;
            transition: all .5s;


        }

        .box li:hover .pic::after{
            transform: translate(-50%,-50%) scale(1);


            /* transform: scale(1); */
            opacity: 1;
        }

    </style>
</head>
<body>
    <div class="box">
        <ul>
            <li>
                <div class="pic">
                    <img src="./images/windcar1.jpeg" alt="">
                </div>
                <p>金鹰奖 盛典时刻  即将揭幕。。。</p>
            </li>
        </ul>
    </div>

    
</body>
</html>
