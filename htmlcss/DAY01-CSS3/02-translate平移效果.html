<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .father{
            width: 400px;
            height: 400px;
            background-color: pink;

        }
        .son{
            width: 200px;
            height: 200px;
            background-color: red;
            /* 过渡属性 */
            transition: all 1s;

        }
        /* 鼠标悬停时，子元素平移改变位置 */
        div.father:hover .son{
            /* 写两个值：改变元素在二维平面上的水平和垂直位置 */
            transform: translate(100px,100px);
            /* 只写一个值，表示平移方向：水平方向 */
            transform: translate(100px);
            /* 取值为百分比，相对于元素自身的宽度和高度 */
            transform: translate(50%,100%);
            transform: translate(-50%,-50%);
        }
    </style>
</head>
<body>
    <div class="father">
        <div class="son"></div>
    </div>

    
</body>
</html>
