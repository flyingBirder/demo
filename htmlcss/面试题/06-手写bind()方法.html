<!-- 手写bind()方法
 1.定义myBind()方法
 2.返回绑定this的新函数
 3.合并绑定 和新传入的参数

-->

<body>
    <script>
        // 1.定义myBind()方法
        Function.prototype.myBind = function (thisArg, ...args) {
            console.log(args);
            // 2.返回绑定this的新函数
            return (...reArgs) => {
                console.log(reArgs);// 新传入的参数
                // this指向上一级作用域的this指向，函数func；
                return this.call(thisArg, ...args, ...reArgs);// 调用新函数时，3.合并绑定的参数和新传入的参数,绑定的参数先于新传入的参数
            }
            // 等价写法   
            // return (...reArgs) => this.call(thisArg, ...args, ...reArgs);

        }
        function func(num1, num2, num3, num4) {
            console.log(this);
            console.log(num1, num2, num3, num4);
            return num1 + num2 + num3 + num4;
        }
        const person = {
            name: '张三',
        }
        const bindFunc = func.myBind(person, 1, 2);
        const res = bindFunc(3, 4);
        console.log(res);

    </script>
</body>

</html>
