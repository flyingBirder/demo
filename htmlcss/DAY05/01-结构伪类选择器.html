<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结构伪类选择器</title>
    <style>
        ul li:first-child{
            background: yellowgreen;
        }
        ul li:last-child{
            background: brown;
        }
        ul li:nth-child(2){
            background: cadetblue;
        }
    </style>
</head>
<body>
    <ul>
        <li>我是li标签1</li>
        <li>我是li标签2</li>
        <li>我是li标签3</li>
        <li>我是li标签4</li>
        <li>我是li标签5</li>
        <li>我是li标签6</li>
    </ul>
    
</body>
</html>
