<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清楚默认样式</title>
    <style>
        /* 清楚默认样式 */
        *{
            margin: 0;
            padding: 0;
            /* 盒子模型：border-box 边框盒模型 */
            box-sizing: border-box;
        }
        /* 清除列表默认样式 */
        li{
            list-style: none;
        }
    </style>
</head>
<body>
    <div>
        我是一个div
    </div>
    <p>我是一个p</p>
    <h1>我是一个h1</h1>
    <ul>
        <li>我是一个li</li>
        <li>我是一个li</li>
        <li>我是一个li</li>
    </ul>
    
</body>
</html>
