<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例一卡片</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: #f1f1f1;
        }
        .product{
            margin: 50px auto;
            width: 270px;
            height: 253px;
            background: #fff;
            text-align: center;
            padding-top: 40px;
            border-radius: 10px;
            
        }

        .product img{
            
            border-radius: 50%;
        }
        .product h4{
            margin-top: 20px;
            margin-bottom: 13px;
            font-size: 18px;
            color: #333;
            font-weight: 400;

        }
        .product p{
            color:#555;
            font-size: 12px;

        }
    </style>
</head>
<body>
    <div class="product">
        <img src="./images/1.jpeg" alt="">
        <h4>商品名称</h4>
        <p>商品描述...</p>
    </div>
    

</body>
</html>
