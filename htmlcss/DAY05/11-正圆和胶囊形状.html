<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 盒子必须为正方形，正圆：border-radius: 50%; */
        /* 盒子必须为长方形，胶囊形状：border-radius: 高度一半; */
        .circle{
            width: 200px;
            height: 200px;
            background: red;
            border-radius: 50%;
        }
        .capsule{
            width: 200px;
            height: 80px;
            background: fuchsia;
            border-radius: 40px;
        }
        
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="capsule"></div>
    
</body>
</html>
