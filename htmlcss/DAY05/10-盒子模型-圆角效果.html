<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆角效果</title>
    <style>
        
        div{
            width: 200px;
            height: 200px;
            background: #0069c2;
            /* 圆角效果：border-radius */
            /* 圆角效果-单方向：border-top-left-radius、border-top-right-radius、border-bottom-right-radius、border-bottom-left-radius */
            /* border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            border-bottom-left-radius: 20px; */
            /* 圆角效果-多值写法 */
            /* 四值：上左 上右 下右 下左 */
            border-radius: 20px 30px 40px 50px;
            /* 三值：上 左右 下 */
            border-radius: 20px 30px 20px;
            /* 二值：上下 左右 */
            border-radius: 40px 80px;
            /* 单值：所有方向 */
            border-radius: 20px;

            border-radius: 1px 99px;
        }

        
    </style>
</head>
<body>
    <div></div>
    
</body>
</html>
