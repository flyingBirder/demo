<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            /* 透视属性 取值范围800-1200px */
            perspective: 1000px;
            
        }
        .child{
            margin: 100px auto;
            width: 200px;
            height: 200px;
            background-color: pink;
            /* 过渡属性 */
            transition: all 1s;
        }
        .child:hover{
            /* 默认z轴是0，所以平移时看不到效果 */
            /* transform: translate3d(100px,100px,100px);
            transform: translateX(100px);
            transform: translateY(100px); */
            transform: translateZ(100px); 
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>
    
</body>
</html>
