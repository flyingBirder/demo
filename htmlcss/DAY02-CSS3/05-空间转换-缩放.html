<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 1.搭建立方体：绿色是立方体的前面，黄色是立方体的上面 
        2.添加鼠标悬停的旋转效果
        */

        .nav{
            width: 300px;
            margin: 120px auto;
        }

        .nav ul{
            display: flex;
            list-style: none;

        }
        .nav li{
            position: relative;
            transform-style: preserve-3d;

            width: 100px;
            height: 40px;
            line-height: 40px;
            transition: all 1s;
            transform: scaleX(0.5);
            transform: scaleY(2);
            transform: scaleZ(3);
            transform: scale3d(0.8,2,3);
        }
     
        .nav li a{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            display: block;
            text-decoration: none;
            color: #fff;
        }
        .nav li a:first-child{
            background-color: green;
            transform: translateZ(20px);

        }
        .nav li a:last-child{
            color:#333;
            background-color: yellow;
            transform: rotateX(90deg) translateZ(20px);
        }
        .nav li:hover{
            transform: rotateX(-90deg);
        }


    </style>
</head>
<body>
    <div class="nav">
        <ul>
            <li>
                <a href="#">首页</a>
                <a href="#">INDEX</a>
            </li>
            <li>
                <a href="#">登陆</a>
                <a href="#">LOGIN</a>
            </li>
            <li>
                <a href="#">注册</a>
                <a href="#">REGISTER</a>
            </li>
        </ul>
    </div>
</body>
</html>
