<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试工具</title>
    <style>
        div{
            color: red;
            line-height: 24px;
            font-size: 20;
        }

    </style>
</head>
<body>
    <!-- 调试工具：浏览器的开发者工具 -->
     <!-- 打开浏览器的开发者工具：F12 -->
     <!-- 开发者工具的作用：查看页面的HTML结构、CSS样式、JavaScript代码、网络请求、错误信息等 -->
     <!-- 开发者工具的常用操作： Elements（元素）、Console（控制台）、Network（网络）、Sources（源代码）、Application（应用程序）、Security（安全）、Performance（性能）、Memory（内存）、Audits（审计） -->
      <!-- Elements（元素）：查看页面的HTML结构，实时修改HTML代码 -->
      <!-- Console（控制台）：查看JavaScript代码的运行结果，调试JavaScript代码 -->
      <!-- Network（网络）：查看页面加载的网络请求，分析网络问题 -->
      <!-- Sources（源代码）：查看页面的JavaScript代码，调试JavaScript代码 -->
      <!-- Application（应用程序）：查看页面的本地存储、会话存储、Cookie等 -->
      <!-- Security（安全）：查看页面的安全问题，如HTTPS证书错误等 -->
      <!-- Performance（性能）：查看页面的性能问题，如加载时间、渲染时间等 -->
      <!-- Memory（内存）：查看页面的内存问题，如内存泄漏等 -->
      <!-- Audits（审计）：查看页面的审计问题，如性能问题、可访问性问题等 -->
    

<div>
     
    开发者工具的常用操作： Elements（元素）、Console（控制台）、Network（网络）、Sources（源代码）、Application（应用程序）、Security（安全）、Performance（性能）、Memory（内存）、Audits（审计）
</div>

    
</body>
</html>
