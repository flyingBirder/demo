<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字属性</title>
    <style>
        /* 通配符选择器 */
        *{
            color: red;
            font-size: 16px;
            font-weight: 400;
            font-style: normal;/*  清除文字样式  */
        }
        /* 元素选择器 */
        p{
            color: gold; /* 文字颜色 */
            font-size: 20px;  /* 文字大小 */
            font-weight: bold;  /* 文字粗细 400去掉加粗 ， 加粗700*/
            font-style: italic;  /* 文字样式 斜体 */


        }
    </style>
</head>
<body>
    <h4>文字属性</h4>
    <p>文字属性</p>
</body>
</html>
