<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本对其齐方式</title>
    <style>
        h4{
            /* 居中的是文本内容 */
            text-align: center;
        }
        div{
            text-align: center;
        }
    </style>
</head>
<body>
    <h4>文本对其齐方式</h4>
    <!-- 居中的是图片, 图片是div的子元素, 所以图片也会居中 -->
    <div>
        <img src="../DAY01/2.jpg" alt="">
    </div>
    
</body>
</html>
