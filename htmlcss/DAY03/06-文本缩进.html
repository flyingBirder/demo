<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 文本缩进</title>
    <style>
        p{
            font-size: 20px;
            text-indent: 2em;
            /* 表示缩进2个文字宽度 */
        }
    </style>
</head>
<body>
     <p>文本缩进为两个文字大小：循着2024年国际体育十大新闻的足迹，回顾世界体坛这一年的光荣与梦想、期待与渴望，无数瞬间重现，几多情绪交织。风云变幻中，人们感受体育的激情与力量，感慨世事的变迁与冷暖，感悟人类的命运与未来。</p>

</body>
</html>
