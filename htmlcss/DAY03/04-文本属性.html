<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            /* 字体默认16px */
            font-size: 16px; 
        }
        p{

            /* line-height: 20px; */
            /* 行高的值设置为数字，代表行高 = 当前文字大小的倍数 */
            line-height: 2;
        }
        div{
            height: 100px;
            line-height: 100px;
            background-color: aqua;

        }
    </style>
</head>
<body>
    <p>花篮内，选取了美好寓意的花卉，其中荷花寓意和和美美、月季寓意和平希望、珙桐寓意和平之树、橄榄枝寓意荣耀和平、向日葵寓意自由幸福、山丹丹寓意团结奋进、英雄花寓意英勇无畏，结合和平鸽元素，体现“和平发展、欣欣向荣”，表达对祖国繁荣富强的美好祝福，对世界和平发展的美好期盼。</p>
    <div>行高与高度值一样，就可以垂直居中，但只适用于单行文字。</div>
</body>
</html>
