<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font复合属性</title>
    <style>
        *{
            font-size: 16px;
        }
        p{
            /* font:italic 700 30px/2 楷体; */
            /* 文字倾斜 文字加粗 字体大小/行高 字体 */
            /* 注意：字体大小/行高 必须写在一起，不能分开写 */
          /* 字号和字体必须写 */
          font:italic 700 30px/2;
        }
    </style>
</head>
<body>
    <!-- font复合属性：font: font-style font-variant font-weight font-size/line-height font-family -->
     <!-- font复合属性：必须按照顺序写 -->
    <p>font复合属性：文字倾斜 文字加粗 字体大小/行高 字体</p>
    
</body>
</html>
