<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本修饰线</title>
    <style>
        a{
            /* 去掉下划线 */
            text-decoration: none;
        }
        h2{
            /* 添加下划线 */
            text-decoration: underline;
        }
        p{
            /* 添加删除线 */
            text-decoration: line-through;
        }
        span{
            /* 添加上划线 */
            text-decoration: overline;
        }
    </style>
</head>
<body>
    <a href="https://www.baidu.com">百度一下</a>
    <h2>请给标题添加下划线</h2>
    <p>请将这段文字添加删除线</p>
    <span>到最下面了   </span>
    
</body>
</html>
